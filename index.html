<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{
  /* Cheng Blue on deep navy (CCTaxLab design system). Layout: top bar, job rail on the left, workspace with tabs on the right. */
  --navy:#0b1f3a; --navy-2:#132c50; --accent:#00aeef; --accent-ink:#0078a8;
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef3f8; --line:#d6dee8; --ink:#14233a; --muted:#5b6b80;
  --input:#0a3cc2; --good:#1b7f4b; --good-bg:#e3f4ea; --warn:#a15c00; --warn-bg:#fdf0dc; --bad:#b42318; --bad-bg:#fde8e6;
  --band:#cfeefb;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1424; --surface:#101e33; --surface-2:#16263f; --line:#24395a; --ink:#e3ebf5; --muted:#93a4ba;
  --input:#7fb4ff; --good:#5fd08f; --good-bg:#103522; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a7e; --bad-bg:#3d1714;
  --band:#0f3b52; --accent-ink:#4cc9f5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1424; --surface:#101e33; --surface-2:#16263f; --line:#24395a; --ink:#e3ebf5; --muted:#93a4ba;
  --input:#7fb4ff; --good:#5fd08f; --good-bg:#103522; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a7e; --bad-bg:#3d1714;
  --band:#0f3b52; --accent-ink:#4cc9f5; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{color:#9fb3cc;font-size:12px}
.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:2px}
.top .spacer{flex:1}
.save{font-size:12px;color:#9fb3cc}
.save.err{color:#ffb4ab}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04263a;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.top .btn{background:transparent;color:#fff;border-color:#2c4670}
.top .btn.primary{background:var(--accent);color:#04263a;border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}

/* layout */
.shell{flex:1;display:flex;min-height:0}
.rail{width:250px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 14px 6px}
.rail .list{overflow:auto;flex:1;padding:0 8px 10px}
.job{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.job:hover{background:var(--surface-2)}
.job.on{background:var(--surface-2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.job b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job small{color:var(--muted);font-size:12px}
.rail .foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.main{flex:1;min-width:0;overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}

/* job header */
.head{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
.field.wide{grid-column:span 2}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 6px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--navy);color:#fff}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1}

.banner{border-radius:var(--r);padding:10px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--surface-2);color:var(--muted)}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tile h3{margin:0;font-size:12px;color:var(--muted);font-weight:500}
.tile .big{font-size:22px;font-weight:600}
.tile .rng{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;white-space:nowrap;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;width:fit-content}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .count{font-size:11px;color:var(--muted);margin-left:4px}

/* company cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.tp{border-top:3px solid var(--accent)}
.card .ttl{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .ttl b{font-size:14.5px}
.card .meta{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:6px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop input{display:none}
.progress{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.notes{font-size:12.5px;margin:0;padding-left:16px;color:var(--muted)}
.notes li{margin:2px 0}
.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;min-height:160px}
.add:hover{border-color:var(--accent);color:var(--ink)}

/* grid */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 260px)}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--navy);color:#fff;z-index:2;padding:8px 10px;font-weight:600;text-align:right;min-width:150px;max-width:190px;white-space:normal;vertical-align:bottom}
table.g thead th:first-child{left:0;z-index:3;text-align:left}
table.g td:first-child,table.g th.lab{position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 10px;min-width:300px;text-align:left;border-right:1px solid var(--line)}
table.g tr.sec td{background:var(--surface-2);font-weight:600;padding:7px 10px;font-size:12px;letter-spacing:.02em}
table.g tr.sec td:first-child{background:var(--surface-2)}
table.g tr.tot td{font-weight:600}
table.g tr.key td{background:color-mix(in srgb,var(--good-bg) 70%,var(--surface))}
table.g td.v{text-align:right;padding:6px 10px}
table.g td.in{padding:0}
table.g input.cell{width:100%;border:0;background:transparent;text-align:right;padding:6px 10px;color:var(--input);font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px}
table.g input.cell.txt{text-align:center;font-family:var(--font-body)}
table.g input.cell:focus{background:color-mix(in srgb,var(--accent) 10%,var(--surface));outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
table.g td.flag{position:relative}
table.g td.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
table.g td.signbad input{color:var(--bad)}
.ok{color:var(--good)} .no{color:var(--bad)}

/* rejection */
table.r{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface)}
table.r th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:600;vertical-align:bottom}
table.r td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.r select,table.r input[type=text],table.r textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;width:100%}
table.r textarea{min-height:34px;resize:vertical;font-size:12px}
table.r input.amt{color:var(--input);font-family:var(--font-num);text-align:right}

/* results */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px}
.stat{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.stat span:nth-child(odd){color:var(--muted)}
.stat span:nth-child(even){font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.stat .hl{font-weight:600;color:var(--ink)}
svg.strip text{fill:var(--muted);font:11px var(--font-body)}
.basisnote{font-size:12.5px;color:var(--muted)}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(5,15,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:10px;max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{margin:0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.empty{color:var(--muted);padding:30px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:820px){
  .shell{flex-direction:column}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:200px}
  .main{padding:14px}
  .field.wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* sign-in */
#authview{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.authbox h1{margin:0;font-size:20px;text-wrap:balance}
.authbox p{margin:0}
.autherr{color:var(--bad);font-size:13px;min-height:1em}
.who{display:flex;align-items:center;gap:8px;color:#cfe0f2;font-size:13px}
[hidden]{display:none!important}
a.btn{text-decoration:none;justify-content:center}
</style>

    admin:'Administrative expenses', staff:'Staff costs',
    ooe:'Other operating expenses', fv:'Fair value changes on investments',
    pfo:'Profit from operations', intinc:'Interest income',
    invinc:'Investing income', fin:'Finance costs',
    pbt:'Profit / (loss) before taxation', tax:'Income tax expense',
    pat:'Profit / (loss) after taxation'
  };
  const ADJ_KEYS = ['less_interest','less_dividend','adj_invest_disposal','adj_invest_fv',
    'less_rental_nonop','adj_nontrade_forex','less_exceptional_income','add_exceptional_expense'];
  const ADJ_LABELS = {
    less_interest:'Less: Interest income',
    less_dividend:'Less: Dividend income',
    adj_invest_disposal:'Less / add: (Gain) / loss on disposal of investments',
    adj_invest_fv:'Less / add: Fair value (gain) / loss on investments',
    less_rental_nonop:'Less: Rental income (non-operating)',
    adj_nontrade_forex:'Less / add: Non-trade foreign exchange (gain) / loss',
    less_exceptional_income:'Less: Exceptional non-recurring income',
    add_exceptional_expense:'Add back: Exceptional non-recurring expense'
  };
  /* Expected sign of each adjustment as a contribution to NormOP: -1 only negative, +1 only positive, 0 either */
  const ADJ_SIGN = { less_interest:-1, less_dividend:-1, adj_invest_disposal:0, adj_invest_fv:0,
    less_rental_nonop:-1, adj_nontrade_forex:0, less_exceptional_income:-1, add_exceptional_expense:1 };
  const BASIS = {
    YA2023:     { lo:0.375, hi:0.625, median:true,  label:'YA 2023 onwards: 37.5th - 62.5th percentile' },
    PRE_YA2023: { lo:0.25,  hi:0.75,  median:false, label:'Before YA 2023: interquartile range (25th - 75th percentile)' }
  };
  const TESTS = [
    { key:'activity', label:'Functional comparability' },
    { key:'data',     label:'Sufficient & verifiable data' },
    { key:'special',  label:'No start-up / bankrupt / dormant' }
  ];

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[,\s]/g, '')); return isFinite(n) ? n : 0; };

  function blankCompany(isTested) {
    const pl = {}; PL_KEYS.forEach(k => pl[k] = 0);
    const adj = {}; ADJ_KEYS.forEach(k => adj[k] = 0);
    return {
      id: uid(), isTested: !!isTested, name: '', regno: '', activity: '', fye: '',
      pl, adj, adjNotes: {}, pbtReported: null,
      rpt: { sales: 0, purchases: 0 },
      tests: { activity: 'Pass', data: 'Pass', special: 'Pass' },
      reasons: {}, sizeAcceptedByIrbm: false,
      source: null, extraction: null, keptIn: [], warnings: []
    };
  }

  const LEGACY = { less_gain_quoted:'adj_invest_disposal', less_fvgain:'adj_invest_fv', add_fvloss:'adj_invest_fv', less_rental:'less_rental_nonop' };
  /* Bring a stored or imported company up to the current shape; legacy adjustment keys are mapped, unknown ones dropped. */
  function normaliseCompany(c, isTested) {
    const base = blankCompany(isTested);
    const out = { ...base, ...c, pl: { ...base.pl }, adj: { ...base.adj },
      rpt: { ...base.rpt, ...(c.rpt || {}) }, tests: { ...base.tests, ...(c.tests || {}) } };
    PL_KEYS.forEach(k => out.pl[k] = num(c.pl && c.pl[k]));
    Object.entries(c.adj || {}).forEach(([k, v]) => { const k2 = LEGACY[k] || k; if (ADJ_KEYS.includes(k2)) out.adj[k2] = num(out.adj[k2]) + num(v); });
    return out;
  }
  function normaliseJob(j) {
    const base = blankJob();
    return { ...base, ...j, tp: normaliseCompany(j.tp || {}, true), comps: (j.comps || []).map(c => normaliseCompany(c, false)) };
  }

  function blankJob() {
    return { id: uid(), title: 'New benchmarking', basis: 'YA2023', rptThreshold: 0.2,
      windowFrom: '', windowTo: '', tp: blankCompany(true), comps: [], createdAt: Date.now(), updatedAt: Date.now() };
  }

  /* ---------- calculation ---------- */
  function calcCompany(c) {
    const p = {}; PL_KEYS.forEach(k => p[k] = num(c.pl[k]));
    const gp = p.rev + p.cos;
    const pfo = gp + p.ooi + p.dist + p.admin + p.staff + p.ooe + p.fv;
    const pbt = pfo + p.intinc + p.invinc + p.fin;
    const pat = pbt + p.tax;
    const adjTotal = ADJ_KEYS.reduce((s, k) => s + num(c.adj[k]), 0);
    const normop = pbt - p.fin + adjTotal;
    const opex = -(p.dist + p.admin + p.staff + p.ooe);
    const om = p.rev === 0 ? null : normop / p.rev;
    const ncp = (p.rev - normop) === 0 ? null : normop / (p.rev - normop);
    const berry = opex === 0 ? null : gp / opex;
    const pbtCheck = (c.pbtReported === null || c.pbtReported === undefined || c.pbtReported === '')
      ? null : Math.abs(num(c.pbtReported) - pbt) < 1.5;
    return { ...p, gp, pfo, pbt, pat, adjTotal, normop, opex, om, ncp, berry, pbtCheck };
  }

  function rejection(job, c) {
    const tpRev = num(job.tp.pl.rev), rev = num(c.pl.rev), thr = num(job.rptThreshold) || 0.2;
    const sizePass = c.sizeAcceptedByIrbm || rev >= 0.1 * tpRev;
    const rptSalesPct = rev === 0 ? 0 : num(c.rpt.sales) / rev;
    const rptPurchPct = rev === 0 ? 0 : num(c.rpt.purchases) / rev;
    const rptPass = !(rptSalesPct > thr || rptPurchPct > thr);
    const t = c.tests || {};
    const failed = [];
    if (!sizePass) failed.push('Turnover below 10% of tested party');
    if (!rptPass) failed.push('Related-party transactions above ' + Math.round(thr * 100) + '%');
    TESTS.forEach(x => { if ((t[x.key] || 'Pass') !== 'Pass') failed.push(x.label); });
    return { sizePass, rptSalesPct, rptPurchPct, rptPass, accepted: failed.length === 0, failed };
  }

  /* Excel PERCENTILE.INC (linear interpolation) */
  function percentile(vals, p) {
    const a = vals.slice().sort((x, y) => x - y), n = a.length;
    if (!n) return null;
    const h = (n - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
    return a[lo] + (h - lo) * (a[hi] - a[lo]);
  }

  function results(job) {
    const b = BASIS[job.basis] || BASIS.YA2023;
    const tp = calcCompany(job.tp);
    const rows = job.comps.map(c => ({ c, calc: calcCompany(c), rej: rejection(job, c) }));
    const acc = rows.filter(r => r.rej.accepted);
    const stat = {};
    ['om', 'ncp', 'berry'].forEach(k => {
      const v = acc.map(r => r.calc[k]).filter(x => x !== null && isFinite(x));
      const lo = percentile(v, b.lo), hi = percentile(v, b.hi);
      const med = b.median && lo !== null ? (lo + hi) / 2 : null;
      const t = tp[k];
      let concl = 'n/a';
      if (t !== null && lo !== null) concl = (t >= lo && t <= hi) ? 'Within range' : (t < lo ? 'Below range' : 'Above range');
      stat[k] = { n: v.length, min: v.length ? Math.min(...v) : null, max: v.length ? Math.max(...v) : null, lo, hi, med, tp: t, concl, values: v };
    });
    return { basis: b, tp, rows, acc, stat };
  }

  /* ---------- Excel export (mirrors tnmm-benchmarking-v3 build_benchmark.py) ---------- */
  const colL = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  async function buildWorkbook(ExcelJS, job) {
    const b = BASIS[job.basis] || BASIS.YA2023;
    const thr = num(job.rptThreshold) || 0.2;
    const comps = [job.tp, ...job.comps];
    const cols = comps.map((_, i) => colL(i + 1));      // B, C, ...
    const tpCol = cols[0], compCols = cols.slice(1);
    const by = {}; comps.forEach((c, i) => by[cols[i]] = c);

    const wb = new ExcelJS.Workbook();
    wb.creator = 'TNMM Benchmarking'; wb.calcProperties.fullCalcOnLoad = true;
    const ws = wb.addWorksheet('Calculation', { views: [{ showGridLines: false, state: 'frozen', xSplit: 1 }] });

    const F = (o = {}) => ({ name: 'Arial', size: 10, ...o });
    const BLUE = F({ color: { argb: 'FF0000FF' } }), BLACK = F(), BLACKB = F({ bold: true });
    const GREEN = F({ color: { argb: 'FF008000' } }), WHITEB = F({ bold: true, color: { argb: 'FFFFFFFF' } });
    const TITLE = { name: 'Arial', size: 12, bold: true, color: { argb: 'FF1F3864' } };
    const fill = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + hex } });
    const HDRF = fill('1F3864'), SECF = fill('D9E1F2'), ACCF = fill('E2EFDA'), STATF = fill('FFF2CC'), CONCF = fill('E2EFDA'), SUBHF = fill('2F5597');
    const thin = { style: 'thin', color: { argb: 'FFBFBFBF' } }, BORD = { top: thin, left: thin, bottom: thin, right: thin };
    const NUM2 = '#,##0.00;(#,##0.00);"-"', NUM = '#,##0;(#,##0);"-"', PCT = '0.00%;(0.00%);"-"', MULT = '0.00"x"';

    function setc(sheet, coord, val, font = BLACK, fmt, fl, align, wrap, bord) {
      const c = sheet.getCell(coord);
      c.value = (typeof val === 'string' && val.startsWith('=')) ? { formula: val.slice(1) } : val;
      c.font = font;
      if (fmt) c.numFmt = fmt;
      if (fl) c.fill = fl;
      if (align || wrap) c.alignment = { horizontal: align, wrapText: !!wrap, vertical: 'middle' };
      if (bord) c.border = BORD;
      return c;
    }
    const S = (coord, val, o = {}) => setc(ws, coord, val, o.font, o.fmt, o.fill, o.align, o.wrap, o.bord);
    function section(r, text, fl = SECF, font = BLACKB, extra = []) {
      S('A' + r, text, { font, fill: fl });
      new Set([...cols, ...extra]).forEach(col => { ws.getCell(col + r).fill = fl; });
    }

    let r = 1;
    S('A' + r, 'TRANSFER PRICING BENCHMARKING ANALYSIS - TNMM', { font: TITLE }); r++;
    const sub = `Tested Party: ${job.tp.name || ''}${job.tp.regno ? ' (' + String(job.tp.regno).split(' ')[0] + ')' : ''} | FYE ${job.tp.fye || ''}`;
    S('A' + r, sub, { font: { name: 'Arial', size: 9, italic: true } }); r += 2;
    const win = (job.windowFrom && job.windowTo) ? ` (comparable FYE within ${fmtMonth(job.windowFrom)} - ${fmtMonth(job.windowTo)})` : '';
    section(r, `BENCHMARK YEAR - Tested Party FYE ${job.tp.fye || ''}${win}`, HDRF, WHITEB); r += 2;

    [['Company name', 'name', true], ['Registration No.', 'regno', false], ['Business activity', 'activity', false]].forEach(([label, key, isname]) => {
      S('A' + r, label, { font: isname ? BLACKB : BLACK });
      cols.forEach(col => S(col + r, String(by[col][key] || ''), { font: (isname && col === tpCol) ? BLACKB : BLACK, align: 'center', wrap: isname || key === 'activity' }));
      if (isname || key === 'activity') ws.getRow(r).height = 42;
      r++;
    });
    S('A' + r, 'Financial year end');
    cols.forEach(col => S(col + r, String(by[col].fye || ''), { align: 'center' }));
    r += 2;

    const rows = {};
    section(r, '1.  STATEMENT OF PROFIT OR LOSS'); r++;
    const inrow = k => { S('A' + r, PL_LABELS[k]); cols.forEach(col => S(col + r, num(by[col].pl[k]), { font: BLUE, fmt: NUM2, bord: true })); rows[k] = r++; };
    const frow = (k, fn) => { S('A' + r, PL_LABELS[k], { font: BLACKB }); cols.forEach(col => S(col + r, fn(col), { font: BLACKB, fmt: NUM2, bord: true })); rows[k] = r++; };
    inrow('rev'); inrow('cos');
    frow('gp', c => `=${c}${rows.rev}+${c}${rows.cos}`);
    ['ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].forEach(inrow);
    frow('pfo', c => '=' + ['gp', 'ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].map(k => c + rows[k]).join('+'));
    ['intinc', 'invinc', 'fin'].forEach(inrow);
    frow('pbt', c => '=' + ['pfo', 'intinc', 'invinc', 'fin'].map(k => c + rows[k]).join('+'));
    inrow('tax');
    frow('pat', c => `=${c}${rows.pbt}+${c}${rows.tax}`);
    r++;

    section(r, '2.  TNMM ADJUSTMENTS'); r++;
    S('A' + r, 'Profit / (loss) before taxation'); cols.forEach(col => S(col + r, `=${col}${rows.pbt}`, { fmt: NUM2, bord: true }));
    const adjrows = [r]; r++;
    S('A' + r, 'Add back: Finance costs'); cols.forEach(col => S(col + r, `=-${col}${rows.fin}`, { fmt: NUM2, bord: true }));
    adjrows.push(r); r++;
    ADJ_KEYS.forEach(k => { S('A' + r, ADJ_LABELS[k]); cols.forEach(col => S(col + r, num(by[col].adj[k]), { font: BLUE, fmt: NUM2, bord: true })); adjrows.push(r); r++; });
    r++;

    section(r, '3.  NORMALISED OPERATING PROFIT'); r++;
    S('A' + r, 'Normalised operating profit', { font: BLACKB });
    cols.forEach(col => S(col + r, '=' + adjrows.map(x => col + x).join('+'), { font: BLACKB, fmt: NUM2, bord: true, fill: ACCF }));
    rows.normop = r++;
    S('A' + r, 'Total operating expenses');
    cols.forEach(col => S(col + r, `=-(${col}${rows.dist}+${col}${rows.admin}+${col}${rows.staff}+${col}${rows.ooe})`, { fmt: NUM2, bord: true }));
    rows.opex = r; r += 2;

    section(r, '4.  PROFIT LEVEL INDICATORS'); r++;
    S('A' + r, 'Operating margin  (NormOP / Revenue)');
    cols.forEach(col => S(col + r, `=IF(${col}${rows.rev}=0,"",${col}${rows.normop}/${col}${rows.rev})`, { fmt: PCT, bord: true }));
    rows.ros = r++;
    S('A' + r, 'Net cost plus margin  (NormOP / (Revenue - NormOP))');
    cols.forEach(col => S(col + r, `=IF((${col}${rows.rev}-${col}${rows.normop})=0,"",${col}${rows.normop}/(${col}${rows.rev}-${col}${rows.normop}))`, { fmt: PCT, bord: true }));
    rows.ncpm = r++;
    S('A' + r, 'Berry ratio  (Gross profit / Operating expenses)');
    cols.forEach(col => S(col + r, `=IF(${col}${rows.opex}=0,"",${col}${rows.gp}/${col}${rows.opex})`, { fmt: MULT, bord: true }));
    rows.berry = r; r += 3;

    const hcols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    section(r, '5.  REJECTION CRITERIA', HDRF, WHITEB, hcols.slice(1)); r += 2;
    const heads = ['Comparable', 'Turnover', "Turnover >= 10% of tested party's revenue?", 'RPT sales %', 'RPT purchases %',
      `RPT sales and purchases each <= ${Math.round(thr * 100)}%?`, 'Functional comparability?', 'Sufficient & verifiable data?',
      'No start-up / bankrupt / dormant?', 'CONCLUSION'];
    hcols.forEach((hc, i) => S(hc + r, heads[i], { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    ws.getRow(r).height = 48;
    [['L', 'RPT sales'], ['M', 'RPT purchases']].forEach(([hc, t]) => S(hc + r, t, { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    r++;
    const TPrev = `$${tpCol}$${rows.rev}`;
    const rej = {};
    compCols.forEach(col => {
      const cc = by[col];
      S('A' + r, `${cc.name || ''}  (${String(cc.regno || '').split(' ')[0]})`, { wrap: true, bord: true });
      S('B' + r, `=${col}${rows.rev}`, { fmt: NUM, bord: true });
      if (cc.sizeAcceptedByIrbm) S('C' + r, 'Pass', { font: BLUE, align: 'center', bord: true });
      else S('C' + r, `=IF(B${r}>=0.1*${TPrev},"Pass","Fail")`, { align: 'center', bord: true });
      S('L' + r, num(cc.rpt.sales), { font: BLUE, fmt: NUM, bord: true });
      S('M' + r, num(cc.rpt.purchases), { font: BLUE, fmt: NUM, bord: true });
      S('D' + r, `=IF(B${r}=0,0,L${r}/B${r})`, { fmt: PCT, bord: true });
      S('E' + r, `=IF(B${r}=0,0,M${r}/B${r})`, { fmt: PCT, bord: true });
      S('F' + r, `=IF(OR(D${r}>${thr},E${r}>${thr}),"Fail","Pass")`, { align: 'center', bord: true });
      [['G', 'activity'], ['H', 'data'], ['I', 'special']].forEach(([hc, k]) => S(hc + r, (cc.tests && cc.tests[k]) || 'Pass', { font: BLUE, align: 'center', bord: true }));
      S('J' + r, `=IF(AND(C${r}="Pass",F${r}="Pass",G${r}="Pass",H${r}="Pass",I${r}="Pass"),"ACCEPTED","REJECTED")`, { font: BLACKB, align: 'center', bord: true });
      rej[col] = r++;
    });

    ws.getColumn('A').width = 52;
    new Set([...cols, ...hcols.slice(1)]).forEach(col => { ws.getColumn(col).width = 16; });
    ['L', 'M'].forEach(col => { ws.getColumn(col).width = 14; });

    /* Summary */
    const s = wb.addWorksheet('Summary of Interquartile', { views: [{ showGridLines: false }] });
    const SS = (coord, val, o = {}) => setc(s, coord, val, o.font, o.fmt, o.fill, o.align, o.wrap, o.bord);
    SS('A1', "SUMMARY OF ARM'S LENGTH RANGE - TNMM", { font: TITLE });
    r = 3;
    SS('A' + r, `ARM'S LENGTH RANGE - TESTED PARTY FYE ${String(job.tp.fye || '').toUpperCase()}`, { font: WHITEB, fill: HDRF });
    ['B', 'C', 'D', 'E'].forEach(col => { s.getCell(col + r).fill = HDRF; });
    r++;
    SS('A' + r, 'Range basis', { font: BLACKB }); SS('B' + r, b.label); r++;
    SS('A' + r, 'Lower percentile', { font: BLACKB }); SS('B' + r, b.lo, { font: BLUE, fmt: '0.0%' }); const loCell = `$B$${r}`;
    SS('C' + r, 'Upper percentile', { font: BLACKB }); SS('D' + r, b.hi, { font: BLUE, fmt: '0.0%' }); const hiCell = `$D$${r}`;
    r += 2;
    ['Comparable', 'Accepted?', 'Operating margin', 'Net cost plus margin', 'Berry ratio'].forEach((h, i) =>
      SS(['A', 'B', 'C', 'D', 'E'][i] + r, h, { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    s.getRow(r).height = 30; r++;
    const first = r;
    compCols.forEach(col => {
      const cc = by[col];
      SS('A' + r, `${cc.name || ''} (${String(cc.regno || '').split(' ')[0]})`, { bord: true });
      SS('B' + r, `=IF(Calculation!J${rej[col]}="ACCEPTED","Yes","No")`, { font: GREEN, align: 'center', bord: true });
      SS('C' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.ros},"")`, { font: GREEN, fmt: PCT, bord: true });
      SS('D' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.ncpm},"")`, { font: GREEN, fmt: PCT, bord: true });
      SS('E' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.berry},"")`, { font: GREEN, fmt: MULT, bord: true });
      r++;
    });
    const last = Math.max(first, r - 1);
    const rng = c => `${c}${first}:${c}${last}`;
    const lines = [['Minimum', 'min'], [`Lower quartile (${b.lo * 100}th percentile)`, 'lo']];
    if (b.median) lines.push(['Median', 'med']);
    lines.push([`Upper quartile (${b.hi * 100}th percentile)`, 'hi'], ['Maximum', 'max']);
    const st = {};
    lines.forEach(([lab, k]) => { SS('A' + r, lab, { font: BLACKB, fill: STATF }); st[k] = r++; });
    [['C', PCT], ['D', PCT], ['E', MULT]].forEach(([col, fmt]) => {
      const o = { font: BLACKB, fmt, fill: STATF, bord: true };
      SS(col + st.min, `=MIN(${rng(col)})`, o);
      SS(col + st.lo, `=PERCENTILE(${rng(col)},${loCell})`, o);
      SS(col + st.hi, `=PERCENTILE(${rng(col)},${hiCell})`, o);
      SS(col + st.max, `=MAX(${rng(col)})`, o);
      if (st.med) SS(col + st.med, `=(${col}${st.lo}+${col}${st.hi})/2`, o);
    });
    SS('A' + r, 'Number of accepted comparables');
    ['C', 'D', 'E'].forEach(col => SS(col + r, `=COUNT(${rng(col)})`, { fmt: '0', bord: true }));
    r++;
    SS('A' + r, `TESTED PARTY - ${job.tp.name || ''}`, { font: BLACKB, fill: CONCF }); SS('B' + r, 'Tested', { font: BLACKB, align: 'center', fill: CONCF });
    SS('C' + r, `=Calculation!${tpCol}${rows.ros}`, { font: GREEN, fmt: PCT, fill: CONCF, bord: true });
    SS('D' + r, `=Calculation!${tpCol}${rows.ncpm}`, { font: GREEN, fmt: PCT, fill: CONCF, bord: true });
    SS('E' + r, `=Calculation!${tpCol}${rows.berry}`, { font: GREEN, fmt: MULT, fill: CONCF, bord: true });
    const tpr = r++;
    SS('A' + r, 'Conclusion', { font: BLACKB });
    ['C', 'D', 'E'].forEach(col => {
      const lo = col + st.lo, hi = col + st.hi;
      SS(col + r, `=IF(${col}${tpr}="","n/a",IF(AND(${col}${tpr}>=${lo},${col}${tpr}<=${hi}),"Within range",IF(${col}${tpr}<${lo},"Below range","Above range")))`, { font: BLACKB, align: 'center', bord: true });
    });
    s.getColumn('A').width = 46;
    ['B', 'C', 'D', 'E'].forEach(col => { s.getColumn(col).width = 22; });

    return wb;
  }

  function fmtMonth(iso) {
    if (!iso) return '';
    const d = new Date(iso + (iso.length === 7 ? '-01' : ''));
    return isNaN(d) ? iso : d.toLocaleString('en-GB', { month: 'short', year: 'numeric' });
  }

  const api = { PL_KEYS, PL_LABELS, ADJ_KEYS, ADJ_LABELS, ADJ_SIGN, BASIS, TESTS, uid, num, blankCompany, blankJob, normaliseCompany, normaliseJob,
    calcCompany, rejection, percentile, results, buildWorkbook, fmtMonth };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TNMM = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* TNMM Benchmarking app UI */
(function () {
  'use strict';
  const T = window.TNMM;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (v, d = 2) => (v === null || v === undefined || !isFinite(v)) ? '–' : (Math.abs(v) < 0.005 && d === 2 ? '–' : (v < 0 ? '(' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + ')' : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })));
  const pct = v => (v === null || v === undefined || !isFinite(v)) ? '–' : (v < 0 ? '(' + (Math.abs(v) * 100).toFixed(2) + '%)' : (v * 100).toFixed(2) + '%');
  const mult = v => (v === null || v === undefined || !isFinite(v)) ? '–' : v.toFixed(2) + 'x';
  const PLI = { om: { label: 'Operating margin', f: pct }, ncp: { label: 'Net cost plus margin', f: pct }, berry: { label: 'Berry ratio', f: mult } };
  const EXAMPLE = window.EXAMPLE_JOB;

  const state = {
    jobs: [], job: null, tab: 'companies', isExample: false,
    sb: null, user: null, profile: null, ocr: {},
    saveState: 'idle', files: {}, busy: {}, aborts: {}
  };

  /* ---------------- persistence ---------------- */
  let saveTimer = null, saving = false, saveAgain = false;
  function touch() {
    if (!state.job) return;
    state.job.updatedAt = Date.now();
    if (state.isExample) { setSave('Example: changes are not saved. Use “Save as new job” to keep it.'); return; }
    clearTimeout(saveTimer); setSave('Unsaved changes…');
    saveTimer = setTimeout(saveNow, 900);
  }
  async function saveNow() {
    const job = state.job; if (!job || state.isExample) return;
    if (!state.sb || !state.user) return;
    if (saving) { saveAgain = true; return; }
    saving = true; setSave('Saving…');
    try {
      const body = JSON.parse(JSON.stringify(job));
      await api('save', { id: job.id, title: job.title || '', job: body });
      const i = state.jobs.findIndex(x => x.id === job.id); if (i >= 0) state.jobs[i] = JSON.parse(JSON.stringify(job)); else state.jobs.unshift(JSON.parse(JSON.stringify(job)));
      renderRail();
      setSave('All changes saved');
    } catch (e) {
      setSave('Could not save: ' + (e && e.message || 'check your connection and try again'), true);
    } finally {
      saving = false;
      if (saveAgain) { saveAgain = false; saveNow(); }
    }
  }
  function localSave() { try { const all = JSON.parse(localStorage.getItem('tnmm-jobs') || '{}'); all[state.job.id] = state.job; localStorage.setItem('tnmm-jobs', JSON.stringify(all)); } catch (e) { /* storage unavailable */ } }
  function localLoad() { try { return Object.values(JSON.parse(localStorage.getItem('tnmm-jobs') || '{}')); } catch (e) { return []; } }
  function setSave(t, err) { const el = $('#save'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } }

  /* ---------------- sign-in through CCTaxLab ---------------- */
  // The CCTaxLab portal and this app share the address clowws-byte.github.io, so the portal's
  // stored sign-in is read here. The TNMM server re-checks it with CCTaxLab on every call.
  async function initAuth() {
    const cfg = window.TNMM_CONFIG;
    if (!window.supabase) { showAuth('The sign-in service could not load. Check your connection and refresh.'); return; }
    state.sb = window.supabase.createClient(cfg.cctUrl, cfg.cctKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data } = await state.sb.auth.getSession();
    await onSession(data.session);
    state.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && (!state.user || state.user.id !== (session && session.user.id)))) onSession(session);
    });
  }
  async function api(action, body, opts = {}) {
    const { data: sess } = await state.sb.auth.getSession();
    const token = sess.session && sess.session.access_token;
    const raw = body instanceof Blob;
    const r = await fetch(window.TNMM_CONFIG.apiUrl + '?action=' + action, {
      method: 'POST', signal: opts.signal,
      headers: { Authorization: 'Bearer ' + (token || ''), apikey: window.TNMM_CONFIG.apiKey, 'Content-Type': raw ? body.type : 'application/json' },
      body: raw ? body : JSON.stringify(body || {})
    });
    const out = await r.json().catch(() => ({}));
    if (r.status === 401) { onSession(null); }
    if (!r.ok) throw new Error(out.error || ('Request failed (' + r.status + ')'));
    return out;
  }
  async function onSession(session) {
    state.user = session ? session.user : null; state.profile = null;
    if (!state.user) return showAuth();
    let me;
    try { me = await api('me'); } catch (e) { return showAuth('The TNMM server could not be reached. Refresh to try again.'); }
    if (!me.ok) return me.reason === 'signin' ? showAuth() : showNoAccess(me.reason);
    state.profile = me.profile;
    showApp();
    try {
      const out = await api('list');
      onJobsLoaded((out.jobs || []).map(r => { const j = T.normaliseJob(r.job || {}); j.id = r.id; j.title = r.title || j.title; j.updatedAt = Date.parse(r.updated_at) || j.updatedAt; return j; }));
    } catch (e) { setSave('Saved jobs could not be loaded', true); onJobsLoaded([]); }
  }
  function showApp() {
    $('#authview').hidden = true; $('.shell').hidden = false; $('#dl').hidden = false; $('#who').hidden = false;
    $('#whoname').textContent = state.profile.name || state.profile.email || '';
    render();
  }
  function hideApp() { $('.shell').hidden = true; $('#dl').hidden = true; $('#who').hidden = true; $('#authview').hidden = false; }
  function showAuth(msg) {
    hideApp();
    $('#authview').innerHTML = `<div class="authbox"><h1>Sign in through CCTaxLab</h1>
      <p>TNMM Benchmarking uses your CCTaxLab account. Sign in to the portal, then open TNMM Benchmarking from your applications.</p>
      <p class="autherr" role="alert">${esc(msg || '')}</p>
      <a class="btn primary" href="${esc(window.TNMM_CONFIG.portalUrl)}">Go to CCTaxLab</a>
      <button class="btn ghost" data-act="recheck">I've signed in, check again</button></div>`;
  }
  function showNoAccess(reason) {
    hideApp();
    $('#authview').innerHTML = `<div class="authbox"><h1>${reason === 'not_approved' ? 'Account not approved' : 'No access yet'}</h1>
      <p>${reason === 'not_approved' ? 'Your CCTaxLab account is waiting for approval.' : 'Your CCTaxLab account does not have access to TNMM Benchmarking. Ask an admin to grant it in CCTaxLab → Admin → Access.'}</p>
      <p class="meta">${esc(state.user && state.user.email)}</p>
      <a class="btn" href="${esc(window.TNMM_CONFIG.portalUrl)}">Back to CCTaxLab</a>
      <button class="btn ghost" data-act="recheck">Check again</button></div>`;
  }
  let firstLoad = true;
  function onJobsLoaded(jobs) {
    firstLoad = true;
    state.jobs = jobs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (firstLoad) {
      firstLoad = false;
      if (state.jobs.length) openJob(state.jobs[0].id); else openExample();
    } else if (state.job && !state.isExample && !saving) {
      // keep the open job; refresh only the list
    }
    renderRail();
  }

  /* ---------------- job actions ---------------- */
  function openExample() { state.job = T.normaliseJob(JSON.parse(JSON.stringify(EXAMPLE))); state.isExample = true; state.tab = 'results'; render(); }
  function openJob(id) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); }
    const cur = state.job && !state.isExample ? state.jobs.findIndex(x => x.id === state.job.id) : -1;
    if (cur >= 0) state.jobs[cur] = state.job;
    const j = state.jobs.find(x => x.id === id); if (!j) return;
    state.job = T.normaliseJob(JSON.parse(JSON.stringify(j))); state.isExample = false; render();
  }
  function newJob() {
    const j = T.blankJob(); j.id = crypto.randomUUID(); j.title = 'New benchmarking';
    state.jobs.unshift(j); state.job = j; state.isExample = false; state.tab = 'companies';
    touch(); render();
  }
  function saveExampleAsNew() {
    const j = T.normaliseJob(JSON.parse(JSON.stringify(state.job))); j.id = crypto.randomUUID(); j.title = (j.title || 'Benchmarking').replace(/\s*\(example\)\s*/i, '') + ' (copy)';
    state.jobs.unshift(j); state.job = j; state.isExample = false; touch(); render(); toast('Saved as a new job');
  }
  function duplicateJob() {
    const j = T.normaliseJob(JSON.parse(JSON.stringify(state.job))); j.id = crypto.randomUUID(); j.title = (j.title || '') + ' (copy)'; j.createdAt = Date.now();
    state.jobs.unshift(j); state.job = j; state.isExample = false; touch(); render(); toast('Job duplicated');
  }
  function deleteJob() {
    const j = state.job; if (!j || state.isExample) return;
    confirmBox('Delete this job?', `“${esc(j.title)}” and its figures will be removed. Uploaded PDFs are never stored, so nothing else is affected.`, 'Delete job', async () => {
      state.jobs = state.jobs.filter(x => x.id !== j.id);
      try { await api('delete', { id: j.id }); } catch (e) { toast('Could not delete the job: ' + e.message); }
      if (state.jobs.length) openJob(state.jobs[0].id); else openExample();
    });
  }

  /* ---------------- rendering ---------------- */
  function render() {
    const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
    renderRail(); renderMain();
    if (fid) { const el = document.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if (el) { el.focus(); if (el.select) try { el.select(); } catch (e) { /* not selectable */ } } }
  }

  function renderRail() {
    const list = $('#jobs'); if (!list) return;
    const items = state.jobs.map(j => `<button class="job ${state.job && !state.isExample && state.job.id === j.id ? 'on' : ''}" data-job="${esc(j.id)}"><b>${esc(j.title || 'Untitled')}</b><small>${esc(j.tp && j.tp.name || 'No tested party yet')} · ${new Date(j.updatedAt || Date.now()).toLocaleDateString('en-GB')}</small></button>`).join('');
    list.innerHTML = `<button class="job ${state.isExample ? 'on' : ''}" data-example="1"><b>Example: Pasti Seterus FY2023</b><small>Sample data, not saved</small></button>` + (items || '<p class="empty" style="padding:12px">No saved jobs yet.</p>');
  }

  function renderMain() {
    const m = $('#main'); const job = state.job; if (!job) { m.innerHTML = '<p class="empty">Loading…</p>'; return; }
    const R = T.results(job);
    const accN = R.acc.length;
    m.innerHTML = `
      ${state.isExample ? `<div class="banner">You are viewing the example job. Edits here are not saved; it shows how a finished job looks. <button class="btn sm primary" data-act="save-example">Save as new job</button></div>` : ''}
      ${headerHtml(job)}
      ${tilesHtml(R)}
      <div class="tabs" role="tablist">
        ${[['companies', 'Companies', 1 + job.comps.length], ['calc', 'Calculation'], ['reject', 'Rejection', accN + '/' + job.comps.length + ' accepted'], ['results', 'Results']]
          .map(([k, l, c]) => `<button role="tab" data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}${c !== undefined ? `<span class="count">${esc(c)}</span>` : ''}</button>`).join('')}
      </div>
      <section id="tabbody">${state.tab === 'companies' ? companiesHtml(job) : state.tab === 'calc' ? calcHtml(job, R) : state.tab === 'reject' ? rejectHtml(job, R) : resultsHtml(job, R)}</section>`;
    $('#dl').disabled = !job.tp.name && !job.comps.length;
  }

  function headerHtml(job) {
    return `<div class="head">
      <div class="field wide"><label for="f-title">Job title</label><input id="f-title" data-fid="title" data-job-field="title" value="${esc(job.title)}"></div>
      <div class="field"><label for="f-tpfye">Tested party FYE</label><input id="f-tpfye" data-fid="tpfye" data-tp-field="fye" placeholder="31 Dec 2023" value="${esc(job.tp.fye)}"></div>
      <div class="field"><label>Arm's length range basis</label><div class="seg" role="group">
        <button data-basis="YA2023" class="${job.basis === 'YA2023' ? 'on' : ''}">YA 2023 onwards</button>
        <button data-basis="PRE_YA2023" class="${job.basis === 'PRE_YA2023' ? 'on' : ''}">Before YA 2023</button></div></div>
      <div class="field wide"><label for="f-wfrom">Comparable FYE window</label><div class="row">
        <input id="f-wfrom" type="month" data-fid="wfrom" data-job-field="windowFrom" value="${esc(job.windowFrom)}">
        <span>to</span>
        <input id="f-wto" type="month" data-fid="wto" data-job-field="windowTo" value="${esc(job.windowTo)}">
        <button class="btn sm" data-act="suggest-window" title="Six months before and after the tested party FYE">±6 months</button></div></div>
      <div class="field"><label for="f-rpt">RPT threshold</label><div class="row"><input id="f-rpt" class="num" data-fid="rpt" data-job-field="rptThreshold" value="${esc(Math.round(T.num(job.rptThreshold) * 100))}" inputmode="decimal"><span>%</span></div></div>
    </div>`;
  }

  function concChip(c) { return c === 'Within range' ? `<span class="chip good">${c}</span>` : c === 'n/a' ? `<span class="chip mute">Not enough data</span>` : `<span class="chip ${c === 'Below range' ? 'bad' : 'warn'}">${c}</span>`; }
  function tilesHtml(R) {
    return `<div class="tiles">${Object.entries(PLI).map(([k, p]) => {
      const s = R.stat[k];
      return `<div class="tile"><h3>${p.label} · tested party</h3><div class="big num">${p.f(s.tp)}</div>
        <div class="rng num">Range ${p.f(s.lo)} – ${p.f(s.hi)}${s.med !== null ? ' · median ' + p.f(s.med) : ''} · n = ${s.n}</div>${concChip(s.concl)}</div>`;
    }).join('')}</div>`;
  }

  /* ---- companies tab ---- */
  function companiesHtml(job) {
    const canRead = !!state.user;
    const cards = [job.tp, ...job.comps].map(c => companyCard(c, canRead)).join('');
    return `<div class="cards" style="margin-top:12px">${cards}<button class="card add" data-act="add-comp">+ Add comparable</button></div>`;
  }
  function statusChip(c) {
    if (state.busy[c.id]) return '<span class="chip warn">Reading…</span>';
    if (c.extraction && c.extraction.at) return c.extraction.checked ? '<span class="chip good">Checked</span>' : '<span class="chip warn">Read by OCR · check figures</span>';
    if (T.num(c.pl.rev)) return '<span class="chip mute">Entered manually</span>';
    return '<span class="chip mute">No figures yet</span>';
  }
  function companyCard(c, canRead) {
    const k = T.calcCompany(c);
    const f = state.files[c.id];
    const busy = state.busy[c.id];
    const tie = k.pbtCheck === null ? '' : k.pbtCheck ? '<span class="ok">✓ PBT agrees to accounts</span>' : `<span class="no">✗ PBT ${fmt(k.pbt)} differs from accounts ${fmt(T.num(c.pbtReported))}</span>`;
    const warns = (c.warnings || []).map(w => `<li>${esc(w)}</li>`).join('');
    const kept = (c.keptIn || []).map(w => `<li>${esc(w.item)}${w.amount ? ' (' + fmt(T.num(w.amount)) + ')' : ''}: ${esc(w.reason || 'kept in operating profit')}</li>`).join('');
    return `<div class="card ${c.isTested ? 'tp' : ''}" data-cid="${esc(c.id)}">
      <div class="ttl"><div><div class="meta">${c.isTested ? 'Tested party' : 'Comparable'}</div><b>${esc(c.name || (c.isTested ? 'Tested party' : 'New comparable'))}</b></div>${statusChip(c)}</div>
      <div class="kv"><span>Reg. no.</span><span>${esc(c.regno || '–')}</span><span>FYE</span><span>${esc(c.fye || '–')}</span>
        <span>Revenue</span><span class="num">${fmt(k.rev)}</span><span>Operating margin</span><span class="num">${pct(k.om)}</span></div>
      ${tie ? `<div style="font-size:12.5px">${tie}</div>` : ''}
      ${canRead ? (busy ? `<div class="progress"><span>${esc(busy.msg)}</span><button class="btn sm" data-act="stop" data-id="${esc(c.id)}">Stop</button></div><div class="bar"><i style="width:${Math.round((busy.p || 0.05) * 100)}%"></i></div>`
        : `<label class="drop" data-drop="${esc(c.id)}">${f ? `<b>${esc(f.name)}</b> · ${(f.size / 1048576).toFixed(1)} MB<br>Drop another file to replace` : 'Upload audited accounts (PDF or page images)<br>or drop the file here'}<input type="file" accept="application/pdf,image/png,image/jpeg,image/webp" ${f ? '' : ''} data-file="${esc(c.id)}"></label>
        ${f ? `<button class="btn primary" data-act="extract" data-id="${esc(c.id)}">Read figures</button>` : ''}${state.ocr[c.id] ? ` <button class="btn sm" data-act="view-ocr" data-id="${esc(c.id)}">View OCR text</button>` : ''}`) : ''}
      ${warns ? `<div><div class="meta">Points to check</div><ul class="notes">${warns}</ul></div>` : ''}
      ${kept ? `<div><div class="meta">Kept in operating profit</div><ul class="notes">${kept}</ul></div>` : ''}
      <div class="row" style="justify-content:space-between">
        ${c.extraction && c.extraction.at && !c.extraction.checked ? `<button class="btn sm" data-act="mark-checked" data-id="${esc(c.id)}">Mark figures as checked</button>` : '<span></span>'}
        ${c.isTested ? '' : `<button class="btn sm ghost danger" data-act="remove-comp" data-id="${esc(c.id)}">Remove</button>`}
      </div>
    </div>`;
  }

  /* ---- calculation tab ---- */
  function calcHtml(job, R) {
    const cs = [job.tp, ...job.comps];
    const K = Object.fromEntries(cs.map(c => [c.id, T.calcCompany(c)]));
    const head = `<tr><th>Line</th>${cs.map(c => `<th>${esc(c.name || (c.isTested ? 'Tested party' : 'Comparable'))}${c.isTested ? '<br><small style="color:#9fd8f2">Tested party</small>' : ''}</th>`).join('')}</tr>`;
    const txtRow = (label, key) => `<tr><td>${label}</td>${cs.map(c => `<td class="in"><input class="cell txt" data-fid="${c.id}-${key}" data-c="${c.id}" data-k="${key}" value="${esc(c[key])}"></td>`).join('')}</tr>`;
    const inRow = (label, key, group) => `<tr><td>${label}</td>${cs.map(c => {
      const v = group === 'pl' ? c.pl[key] : c.adj[key];
      const note = group === 'adj' && c.adjNotes && c.adjNotes[key];
      const sgn = group === 'adj' ? T.ADJ_SIGN[key] : 0; const n = T.num(v);
      const bad = (sgn < 0 && n > 0) || (sgn > 0 && n < 0);
      return `<td class="in ${note ? 'flag' : ''} ${bad ? 'signbad' : ''}" ${note ? `title="${esc(note)}"` : bad ? 'title="Check the sign of this adjustment"' : ''}><input class="cell" inputmode="decimal" data-fid="${c.id}-${group}-${key}" data-c="${c.id}" data-g="${group}" data-k="${key}" value="${n ? fmt(n) : ''}" placeholder="–"></td>`;
    }).join('')}</tr>`;
    const cRow = (label, fn, cls = 'tot') => `<tr class="${cls}"><td>${label}</td>${cs.map(c => `<td class="v num">${fn(K[c.id], c)}</td>`).join('')}</tr>`;
    const sec = t => `<tr class="sec"><td>${t}</td>${cs.map(() => '<td></td>').join('')}</tr>`;
    const P = T.PL_LABELS;
    return `<p class="basisnote">Blue figures are inputs from the audited accounts; type over any of them. Black figures are calculated. A dot marks an adjustment with a reason from the reading step (hover to read it).</p>
    <div class="gridwrap"><table class="g"><thead>${head}</thead><tbody>
      ${txtRow('Company name', 'name')}${txtRow('Registration no.', 'regno')}${txtRow('Business activity', 'activity')}${txtRow('Financial year end', 'fye')}
      ${sec('1.  Statement of profit or loss')}
      ${inRow(P.rev, 'rev', 'pl')}${inRow(P.cos, 'cos', 'pl')}${cRow(P.gp, k => fmt(k.gp))}
      ${['ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].map(k => inRow(P[k], k, 'pl')).join('')}
      ${cRow(P.pfo, k => fmt(k.pfo))}
      ${['intinc', 'invinc', 'fin'].map(k => inRow(P[k], k, 'pl')).join('')}
      ${cRow(P.pbt, k => fmt(k.pbt))}
      <tr><td>PBT per audited accounts (check)</td>${cs.map(c => { const k = K[c.id]; return `<td class="in"><input class="cell" inputmode="decimal" data-fid="${c.id}-pbtrep" data-c="${c.id}" data-k="pbtReported" value="${c.pbtReported === null || c.pbtReported === '' || c.pbtReported === undefined ? '' : fmt(T.num(c.pbtReported))}" placeholder="optional" title="${k.pbtCheck === null ? '' : k.pbtCheck ? 'Agrees' : 'Does not agree'}" style="${k.pbtCheck === false ? 'color:var(--bad)' : ''}"></td>`; }).join('')}</tr>
      ${inRow(P.tax, 'tax', 'pl')}${cRow(P.pat, k => fmt(k.pat))}
      ${sec('2.  TNMM adjustments')}
      ${cRow('Profit / (loss) before taxation', k => fmt(k.pbt), '')}
      ${cRow('Add back: Finance costs', k => fmt(-k.fin), '')}
      ${T.ADJ_KEYS.map(k => inRow(T.ADJ_LABELS[k], k, 'adj')).join('')}
      ${sec('3.  Normalised operating profit')}
      ${cRow('Normalised operating profit', k => fmt(k.normop), 'tot key')}
      ${cRow('Total operating expenses', k => fmt(k.opex), '')}
      ${sec('4.  Profit level indicators')}
      ${cRow('Operating margin  (NormOP / Revenue)', k => pct(k.om), '')}
      ${cRow('Net cost plus margin  (NormOP / (Revenue − NormOP))', k => pct(k.ncp), '')}
      ${cRow('Berry ratio  (Gross profit / Operating expenses)', k => mult(k.berry), '')}
    </tbody></table></div>`;
  }

  /* ---- rejection tab ---- */
  function rejectHtml(job, R) {
    if (!job.comps.length) return '<p class="empty">Add comparables in the Companies tab first.</p>';
    const thr = Math.round(T.num(job.rptThreshold) * 100);
    const sel = (c, k) => `<select data-fid="${c.id}-t-${k}" data-c="${c.id}" data-test="${k}"><option ${c.tests[k] === 'Pass' ? 'selected' : ''}>Pass</option><option ${c.tests[k] === 'Fail' ? 'selected' : ''}>Fail</option></select>`;
    return `<div class="gridwrap" style="margin-top:12px"><table class="r"><thead><tr>
      <th>Comparable</th><th>Turnover</th><th>≥ 10% of tested party?</th><th>RPT sales</th><th>RPT purchases</th><th>RPT ≤ ${thr}%?</th>
      <th>Functional comparability</th><th>Sufficient & verifiable data</th><th>No start-up / bankrupt / dormant</th><th>Reason (for your file)</th><th>Conclusion</th></tr></thead><tbody>
      ${R.rows.map(({ c, rej }) => `<tr>
        <td><b>${esc(c.name || 'Comparable')}</b><br><small class="meta">${esc(c.regno)}</small></td>
        <td class="num" style="text-align:right">${fmt(T.num(c.pl.rev), 0)}</td>
        <td>${rej.sizePass ? '<span class="chip good">Pass</span>' : '<span class="chip bad">Fail</span>'}<br><label style="font-size:11.5px"><input type="checkbox" data-c="${c.id}" data-k="sizeAcceptedByIrbm" ${c.sizeAcceptedByIrbm ? 'checked' : ''}> Accepted by IRBM</label></td>
        <td><input type="text" class="amt" data-fid="${c.id}-rs" data-c="${c.id}" data-rpt="sales" value="${T.num(c.rpt.sales) ? fmt(T.num(c.rpt.sales), 0) : ''}" placeholder="0"><small class="num">${pct(rej.rptSalesPct)}</small></td>
        <td><input type="text" class="amt" data-fid="${c.id}-rp" data-c="${c.id}" data-rpt="purchases" value="${T.num(c.rpt.purchases) ? fmt(T.num(c.rpt.purchases), 0) : ''}" placeholder="0"><small class="num">${pct(rej.rptPurchPct)}</small></td>
        <td>${rej.rptPass ? '<span class="chip good">Pass</span>' : '<span class="chip bad">Fail</span>'}</td>
        <td>${sel(c, 'activity')}</td><td>${sel(c, 'data')}</td><td>${sel(c, 'special')}</td>
        <td><textarea data-fid="${c.id}-reason" data-c="${c.id}" data-reason="1" placeholder="Why it was accepted or rejected">${esc(Object.values(c.reasons || {}).join(' '))}</textarea></td>
        <td>${rej.accepted ? '<span class="chip good">Accepted</span>' : `<span class="chip bad">Rejected</span><br><small class="meta">${esc(rej.failed.join('; '))}</small>`}</td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  /* ---- results tab ---- */
  function resultsHtml(job, R) {
    const b = R.basis;
    return `<p class="basisnote">${esc(b.label)}${b.median ? '; median is the mid-point of the 37.5th and 62.5th percentiles.' : '. No median is shown for this basis.'} ${R.acc.length} of ${job.comps.length} comparables accepted.</p>
    <div class="res">${Object.entries(PLI).map(([k, p]) => {
      const s = R.stat[k];
      return `<div class="panel"><div class="row" style="justify-content:space-between"><h3>${p.label}</h3>${concChip(s.concl)}</div>
        ${stripSvg(R, k, p.f)}
        <div class="stat"><span>Minimum</span><span>${p.f(s.min)}</span>
          <span>Lower quartile (${b.lo * 100}th)</span><span class="hl">${p.f(s.lo)}</span>
          ${b.median ? `<span>Median</span><span class="hl">${p.f(s.med)}</span>` : ''}
          <span>Upper quartile (${b.hi * 100}th)</span><span class="hl">${p.f(s.hi)}</span>
          <span>Maximum</span><span>${p.f(s.max)}</span><span>Accepted comparables</span><span>${s.n}</span>
          <span>Tested party</span><span class="hl">${p.f(s.tp)}</span></div></div>`;
    }).join('')}</div>
    ${R.rows.some(r => !r.rej.accepted) ? `<div class="panel" style="margin-top:12px"><h3>Rejected comparables</h3><ul class="notes">${R.rows.filter(r => !r.rej.accepted).map(r => `<li><b>${esc(r.c.name)}</b>: ${esc(r.rej.failed.join('; '))}${Object.values(r.c.reasons || {}).length ? ' · ' + esc(Object.values(r.c.reasons).join(' ')) : ''}</li>`).join('')}</ul></div>` : ''}`;
  }
  function stripSvg(R, k, f) {
    const s = R.stat[k]; const pts = R.acc.map(r => ({ v: r.calc[k], n: r.c.name })).filter(x => x.v !== null && isFinite(x.v));
    if (!pts.length) return '<p class="empty" style="padding:10px">Accept at least one comparable to see the range.</p>';
    const vals = pts.map(p => p.v).concat(s.tp !== null && isFinite(s.tp) ? [s.tp] : []);
    let mn = Math.min(...vals), mx = Math.max(...vals); const pad = (mx - mn || Math.abs(mx) || 1) * 0.08; mn -= pad; mx += pad;
    const W = 320, H = 92, L = 10, Rr = 10, x = v => L + (v - mn) / (mx - mn) * (W - L - Rr);
    const ticks = [mn + pad, (mn + mx) / 2, mx - pad];
    return `<svg class="strip" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(PLI[k].label)} of accepted comparables against the arm's length range">
      <rect x="${x(s.lo)}" y="18" width="${Math.max(1, x(s.hi) - x(s.lo))}" height="34" fill="var(--band)" rx="3"></rect>
      <line x1="${L}" x2="${W - Rr}" y1="35" y2="35" stroke="var(--line)"></line>
      ${s.med !== null ? `<line x1="${x(s.med)}" x2="${x(s.med)}" y1="16" y2="54" stroke="var(--accent-ink)" stroke-dasharray="3 2"></line>` : ''}
      ${pts.map(p => `<circle cx="${x(p.v)}" cy="35" r="4.5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"><title>${esc(p.n)}: ${esc(f(p.v))}</title></circle>`).join('')}
      ${s.tp !== null && isFinite(s.tp) ? `<path d="M${x(s.tp)} 12 l6 -9 h-12 z" fill="var(--accent)"></path><line x1="${x(s.tp)}" x2="${x(s.tp)}" y1="12" y2="56" stroke="var(--accent)" stroke-width="2"></line>` : ''}
      ${ticks.map(t => `<text x="${x(t)}" y="74" text-anchor="middle">${esc(f(t))}</text>`).join('')}
      <text x="${L}" y="${H - 2}">Range ${esc(f(s.lo))} – ${esc(f(s.hi))}</text>
    </svg>`;
  }

  /* ---------------- edits ---------------- */
  function findCo(id) { const j = state.job; return j.tp.id === id ? j.tp : j.comps.find(c => c.id === id); }
  function onChange(e) {
    const t = e.target, job = state.job; if (!job) return;
    if (t.dataset.jobField) {
      const f = t.dataset.jobField; job[f] = f === 'rptThreshold' ? (T.num(t.value) / 100 || 0.2) : t.value;
    } else if (t.dataset.tpField) { job.tp[t.dataset.tpField] = t.value;
    } else if (t.dataset.c) {
      const c = findCo(t.dataset.c); if (!c) return;
      if (t.dataset.g === 'pl') c.pl[t.dataset.k] = T.num(t.value);
      else if (t.dataset.g === 'adj') c.adj[t.dataset.k] = T.num(t.value);
      else if (t.dataset.k === 'pbtReported') c.pbtReported = t.value.trim() === '' ? null : T.num(t.value);
      else if (t.dataset.k === 'sizeAcceptedByIrbm') c.sizeAcceptedByIrbm = t.checked;
      else if (t.dataset.rpt) c.rpt[t.dataset.rpt] = T.num(t.value);
      else if (t.dataset.test) c.tests[t.dataset.test] = t.value;
      else if (t.dataset.reason) c.reasons = { note: t.value };
      else if (t.dataset.k) c[t.dataset.k] = t.value;
    } else return;
    touch(); render();
  }
  async function onClick(e) {
    const b = e.target.closest('button, [data-drop]'); if (!b) return;
    if (b.dataset.auth) return showAuth(b.dataset.auth);
    if (b.dataset.job) return openJob(b.dataset.job);
    if (b.dataset.example) return openExample();
    if (b.dataset.tab) { state.tab = b.dataset.tab; return render(); }
    if (b.dataset.basis) { state.job.basis = b.dataset.basis; touch(); return render(); }
    const act = b.dataset.act; if (!act) return;
    const id = b.dataset.id;
    if (act === 'recheck') { const { data } = await state.sb.auth.getSession(); return onSession(data.session); }
    if (act === 'new') return newJob();
    if (act === 'dup') return duplicateJob();
    if (act === 'del') return deleteJob();
    if (act === 'save-example') return saveExampleAsNew();
    if (act === 'download') return downloadExcel();
    if (act === 'add-comp') { state.job.comps.push(T.blankCompany(false)); touch(); return render(); }
    if (act === 'remove-comp') { const c = findCo(id); return confirmBox('Remove comparable?', `${esc(c.name || 'This comparable')} will be removed from this job.`, 'Remove', () => { state.job.comps = state.job.comps.filter(x => x.id !== id); delete state.files[id]; touch(); render(); }); }
    if (act === 'suggest-window') return suggestWindow();
    if (act === 'extract') return extract(id);
    if (act === 'view-ocr') return viewOcr(id);
    if (act === 'stop') { const a = state.aborts[id]; if (a) a.abort(); return; }
    if (act === 'mark-checked') { const c = findCo(id); c.extraction.checked = true; touch(); return render(); }
  }
  function suggestWindow() {
    const d = parseFye(state.job.tp.fye);
    if (!d) return toast('Enter the tested party FYE first, e.g. 31 Dec 2023');
    const from = new Date(d.getFullYear(), d.getMonth() - 5, 1), to = new Date(d.getFullYear(), d.getMonth() + 6, 1);
    const m = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0');
    state.job.windowFrom = m(from); state.job.windowTo = m(to);
    if (!state.job.basis || state.job.basis === 'YA2023' || state.job.basis === 'PRE_YA2023') state.job.basis = d.getFullYear() >= 2023 ? 'YA2023' : 'PRE_YA2023';
    touch(); render();
  }
  function parseFye(s) { if (!s) return null; const d = new Date(String(s).replace(/(\d+)(st|nd|rd|th)/, '$1')); return isNaN(d) ? null : d; }

  /* ---------------- files & extraction (Mistral OCR via the tnmm-ocr Edge Function) ---------------- */
  function onFile(id, fileList) {
    const f = (fileList || [])[0]; if (!f) return;
    if (!/^(application\/pdf|image\/(png|jpeg|webp))$/.test(f.type)) return toast('Upload a PDF or a PNG/JPEG page image.');
    if (f.size > 20 * 1048576) return toast('That file is over 20 MB. Upload only the financial statements pages.');
    state.files[id] = { file: f, name: f.name, size: f.size };
    delete state.ocr[id];
    const c = findCo(id); c.source = { file: f.name }; touch(); render();
  }
  function setBusy(id, msg, p) { state.busy[id] = { msg, p }; if (state.tab === 'companies') renderMain(); }

  /* Pick the pages that matter from the OCR text: the profit or loss statement and the notes behind it. */
  function scorePage(md, i) {
    const t = md.toLowerCase(); let s = 0;
    if (/statements? of (profit or loss|comprehensive income)|income statement/.test(t) && /revenue/.test(t) && /before tax/.test(t)) s += 10;
    if (/(profit|loss) before tax/.test(t) && /(after charging|arrived at|crediting)/.test(t)) s += 8;
    if (/related part/.test(t)) s += 7;
    if (/other (operating )?income/.test(t)) s += 3;
    if (/income tax expense|tax expense|taxation/.test(t)) s += 2;
    if (/finance costs?|interest income|finance income/.test(t)) s += 2;
    if (/revenue|cost of sales/.test(t)) s += 1;
    if (i < 3 && /(registration no|company no|\(\d{5,7}-[a-z]\))/.test(t)) s += 5;
    if (/principal activit/.test(t)) s += 4;
    if (/statements? of financial position/.test(t) && s < 10) s -= 2;
    if (/statements? of (changes in equity|cash flows)/.test(t) && s < 10) s -= 3;
    return s;
  }
  async function extract(id) {
    const job = state.job, c = findCo(id), f = state.files[id];
    if (!c || !f || state.busy[id]) return;
    const ctl = new AbortController(); state.aborts[id] = ctl;
    try {
      let pages = state.ocr[id] ? state.ocr[id].pages : null;
      if (!pages) {
        setBusy(id, 'Uploading and running OCR on every page. Large scans can take a minute…', 0.25);
        const o = await api('ocr', f.file, { signal: ctl.signal });
        pages = o.pages || [];
        if (!pages.length) throw new Error('OCR returned no text. Check the file is the audited accounts.');
        state.ocr[id] = { file: f.name, pages };
      }
      const ranked = pages.map((p, i) => ({ p, s: scorePage(p.markdown, i) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 14).map(x => x.p);
      const pick = (ranked.length ? ranked : pages.slice(0, 14)).sort((a, b) => a.index - b.index);
      setBusy(id, `Mapping figures from page${pick.length === 1 ? '' : 's'} ${pick.map(p => p.index + 1).join(', ')}…`, 0.65);
      const win = job.windowFrom && job.windowTo ? `between ${T.fmtMonth(job.windowFrom)} and ${T.fmtMonth(job.windowTo)}` : '';
      const out = await api('extract', { pages: pick, role: c.isTested ? 'tested' : 'comparable', fye: job.tp.fye, window: win }, { signal: ctl.signal });
      applyExtraction(c, out.result, pick.map(p => p.index + 1));
      toast(`${c.name || 'Company'}: figures read. Please check them against the accounts.`);
    } catch (e) {
      toast(e && e.name === 'AbortError' ? 'Stopped.' : (e && e.message) || 'Reading failed. Try again.');
    } finally {
      delete state.busy[id]; delete state.aborts[id]; render();
    }
  }
  function viewOcr(id) {
    const o = state.ocr[id]; if (!o) return;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true" style="max-width:860px;max-height:86vh"><div class="row" style="justify-content:space-between"><h3>OCR text · ${esc(o.file)}</h3><button class="btn sm" data-x="no">Close</button></div>
      <div style="overflow:auto;font:12px/1.5 var(--font-num);white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:10px">${o.pages.map(p => `<b>— Page ${p.index + 1} —</b>\n${esc(p.markdown)}`).join('\n\n')}</div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', ev => { if (ev.target.dataset.x === 'no' || ev.target === m) m.remove(); });
  }
  function applyExtraction(c, out, pages) {
    if (!out || typeof out !== 'object' || !out.pl) throw { code: 'invalid_json' };
    ['name', 'regno', 'activity', 'fye'].forEach(k => { if (out[k]) c[k] = String(out[k]).trim(); });
    T.PL_KEYS.forEach(k => c.pl[k] = T.num(out.pl[k]));
    c.pbtReported = out.pbt_reported === undefined || out.pbt_reported === null ? null : T.num(out.pbt_reported);
    T.ADJ_KEYS.forEach(k => c.adj[k] = 0); c.adjNotes = {};
    (out.adjustments || []).forEach(a => {
      if (!a || !T.ADJ_KEYS.includes(a.key)) return;
      const v = T.num(a.amount); if (!v) return;
      c.adj[a.key] = T.num(c.adj[a.key]) + v;
      c.adjNotes[a.key] = [c.adjNotes[a.key], (a.reason || '') + (a.page ? ` (page ${a.page})` : '')].filter(Boolean).join('; ');
    });
    if (out.rpt) c.rpt = { sales: T.num(out.rpt.sales), purchases: T.num(out.rpt.purchases) };
    c.keptIn = (out.kept_in || []).filter(x => x && x.item).slice(0, 12).map(x => ({ item: String(x.item), amount: T.num(x.amount), reason: String(x.reason || '') }));
    const k = T.calcCompany(c);
    const w = (out.warnings || []).filter(x => x && String(x).trim()).map(String).slice(0, 10);
    if (Math.abs(k.gp - (k.rev + k.cos)) > 1) w.push('Gross profit does not agree.');
    if (k.pbtCheck === false) w.push(`Computed PBT ${fmt(k.pbt)} does not agree to the accounts (${fmt(T.num(c.pbtReported))}). Check the line mapping.`);
    c.warnings = w;
    c.extraction = { at: Date.now(), pages, checked: false };
    touch();
  }

  /* ---------------- excel ---------------- */
  async function downloadExcel() {
    const job = state.job; if (!job) return;
    try {
      const wb = await T.buildWorkbook(window.ExcelJS, job);
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const name = `TNMM Benchmarking - ${(job.tp.name || job.title || 'job').replace(/[\\/:*?"<>|]/g, '')} - FYE ${(job.tp.fye || '').replace(/[\\/:*?"<>|]/g, '')}.xlsx`.replace(/\s+/g, ' ');
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast(e && e.code ? 'The download could not be saved.' : 'The workbook could not be built.');
    }
  }

  /* ---------------- small ui helpers ---------------- */
  let toastTimer;
  function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 4200); }
  function confirmBox(title, html, okLabel, onOk) {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p style="margin:0">${html}</p><div class="acts"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="ok">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', ev => { const x = ev.target.dataset.x; if (x === 'ok') { m.remove(); onOk(); } else if (x === 'no' || ev.target === m) m.remove(); });
    $('[data-x="ok"]', m).focus();
  }

  /* ---------------- boot ---------------- */
  document.addEventListener('change', e => {
    if (e.target.dataset.file) return onFile(e.target.dataset.file, e.target.files);
    onChange(e);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input.cell, .head input')) { e.preventDefault(); e.target.blur(); } });
  document.addEventListener('click', onClick);
  document.addEventListener('dragover', e => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', e => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); onFile(d.dataset.drop, e.dataTransfer.files); } });

  openExample();
  initAuth();
})();
</script>
</body>
</html>
