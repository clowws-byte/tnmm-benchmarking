<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNMM Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  /* Elegant: ivory paper, deep navy, fine gold rules and gold numerals. Serif display, clean sans body.
     Layout: navy top bar with gold monogram, jobs rail, numbered steps, then tabs that turn green when done. */
  --navy:#101a33; --navy-2:#1a2747; --ink:#1b2236; --muted:#6c6f7d;
  --gold:#c5a253; --gold-2:#e3cb8f; --gold-d:#9a7a2e; --champagne:#f6efdf;
  --bg:#faf8f3; --surface:#ffffff; --surface-2:#f7f3ea; --line:#e7dfcd; --line-2:#efe9db;
  --input:#1f4fbf; --good:#1d7a4f; --good-bg:#e4f4ea; --good-line:#9fd4b6; --warn:#946200; --warn-bg:#fbf0d6; --bad:#b2283f; --bad-bg:#fbe5e8;
  --band:rgba(197,162,83,.22);
  --font-display:"Cormorant Garamond","Times New Roman",serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-num:"Manrope",system-ui,sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#ece8de; --muted:#a9a69c; --bg:#0d1324; --surface:#141c33; --surface-2:#1a2340; --line:#2c3657; --line-2:#222b48;
  --input:#9cc1ff; --good:#6fd6a2; --good-bg:#123426; --good-line:#2f7a55; --warn:#e8c26a; --warn-bg:#3a2e10; --bad:#ff9aaa; --bad-bg:#3d1620;
  --champagne:#232c49; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#ece8de; --muted:#a9a69c; --bg:#0d1324; --surface:#141c33; --surface-2:#1a2340; --line:#2c3657; --line-2:#222b48;
  --input:#9cc1ff; --good:#6fd6a2; --good-bg:#123426; --good-line:#2f7a55; --warn:#e8c26a; --warn-bg:#3a2e10; --bad:#ff9aaa; --bad-bg:#3d1620;
  --champagne:#232c49; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);display:flex;flex-direction:column;
  background-image:linear-gradient(180deg,rgba(197,162,83,.07),transparent 240px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3,.headttl b,.brand b{font-family:var(--font-display);letter-spacing:.01em}

/* top bar */
.top{background:var(--navy);color:#f3ecd9;display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap;border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:26px;font-weight:600;color:#fff}
.brand b em{font-style:normal;color:var(--gold-2)}
.mascot{width:38px;height:38px;flex:none}
.top .spacer{flex:1}
.save{font-size:12px;color:#c9c2ad}
.save.err{color:#ffb7c0}
.who{display:flex;align-items:center;gap:12px}
#whoname{display:flex;flex-direction:column;line-height:1.2;text-align:right}
#whoname b{font-size:13px;color:#fff;font-weight:700}
#whoname small{font-size:11.5px;color:var(--gold-2)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:700;letter-spacing:.01em;transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(154,122,46,.15)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-d));border-color:transparent;color:#1d1505}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:12.5px}
a.btn{text-decoration:none;justify-content:center}
.top .btn{background:transparent;color:#f3ecd9;border-color:rgba(227,203,143,.45)}
.top .btn:hover{border-color:var(--gold-2)}
.top .btn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-d));color:#1d1505;border-color:transparent}

/* layout */
.shell{flex:1;display:flex;min-height:0}
.rail{width:256px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.rail h2{font:600 18px var(--font-display);color:var(--ink);margin:18px 16px 8px;padding-bottom:6px;border-bottom:1px solid var(--gold)}
.rail .list{overflow:auto;flex:1;padding:0 10px 10px}
.job{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 11px;cursor:pointer;margin-bottom:3px}
.job:hover{background:var(--surface-2)}
.job.on{background:var(--champagne);border-color:var(--gold-2);box-shadow:inset 3px 0 0 var(--gold)}
.job b{display:block;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job small{display:block;color:var(--muted);font-size:12px}
.job small.del{color:var(--gold-d);font-weight:700}
.railnote{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2);padding:10px 4px 0;margin:10px 0 0}
.rail .foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.main{flex:1;min-width:0;overflow:auto;padding:24px 28px 48px;display:flex;flex-direction:column;gap:22px}

/* step titles */
.headttl{display:flex;align-items:center;gap:12px;grid-column:1/-1;font-size:22px}
.headttl b{font-weight:600}
.stepno{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:600 18px var(--font-display);color:var(--navy);background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 0 0 3px var(--champagne)}

/* cards */
.head,.step,.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 var(--line-2),0 10px 28px rgba(16,26,51,.05)}
.head{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 18px;padding:20px 22px;border-top:3px solid var(--gold)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.period label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-width:0}
.field input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(197,162,83,.18)}
.field.wide{grid-column:span 2}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:700;border-radius:999px;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--gold-2)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.period{margin-top:4px}
.period label{text-transform:none;letter-spacing:0;font-size:12.5px}

/* upload & go */
.steps{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:18px}
.step{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.up{position:relative;border:1px dashed var(--gold);border-radius:12px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;background:var(--surface-2);transition:background .15s,box-shadow .15s}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up b{font:600 22px var(--font-display);color:var(--ink)}
.up span{font-size:12.5px;color:var(--ink);font-weight:600}
.up em{font-style:normal;font-size:12px;color:var(--muted)}
.up .upicon{line-height:0;margin-bottom:6px;color:var(--gold-d)}
.up.cp .upicon{color:var(--navy-2)}
.up:hover,.up.over{background:var(--champagne);box-shadow:0 6px 18px rgba(154,122,46,.14)}
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.queue li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.queue li:last-child{border-bottom:0}
.qtag{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:3px 9px;color:var(--navy);background:var(--champagne);border:1px solid var(--gold-2);white-space:nowrap}
.q-tp .qtag{background:var(--navy);color:var(--gold-2);border-color:var(--navy)}
.qname{flex:1;min-width:0;display:flex;flex-direction:column}
.qname b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qname small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qkind{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:600;background:var(--surface)}
.gostep{align-items:stretch;border-top:3px solid var(--gold)}
.go{border:0;border-radius:14px;padding:20px 10px;font:600 30px var(--font-display);color:var(--gold-2);cursor:pointer;letter-spacing:.04em;
  background:radial-gradient(120% 140% at 30% 0%,var(--navy-2),var(--navy));box-shadow:inset 0 0 0 1px rgba(227,203,143,.5),0 12px 26px rgba(16,26,51,.25);display:flex;align-items:center;justify-content:center;gap:14px;transition:transform .1s,box-shadow .15s}
.go span{font:600 26px var(--font-body);color:var(--navy);background:linear-gradient(135deg,var(--gold-2),var(--gold));border-radius:50%;width:46px;height:46px;display:grid;place-items:center}
.go:hover{box-shadow:inset 0 0 0 1px var(--gold-2),0 14px 30px rgba(16,26,51,.32)}
.go:active{transform:translateY(2px)}
.go:disabled{opacity:.7;cursor:progress}

/* result tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{background:var(--navy);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px rgba(227,203,143,.35),0 10px 24px rgba(16,26,51,.18)}
.tile h3{margin:0;font:600 17px var(--font-display);color:#efe7d2}
.lcd{border-top:1px solid rgba(227,203,143,.35);padding-top:6px}
.tile .big{font:600 34px var(--font-num);font-variant-numeric:tabular-nums;color:var(--gold-2);letter-spacing:.01em}
.tile .rng{font-size:12px;color:#b9b3a1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;width:fit-content;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tile .chip.good{background:#173d2c;color:#8fe6b8} .tile .chip.warn{background:#3e3114;color:#f0cf7d} .tile .chip.bad{background:#47202a;color:#ffb3bf} .tile .chip.mute{background:#1f2a49;color:#c2bca9;border-color:transparent}

/* tabs: gold underline when open, green when done */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button.done{color:var(--good);background:var(--good-bg)}
.tabs button.done.on{border-bottom-color:var(--good)}
.tabs .tick{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-size:11px}
.tabs button .count{font-size:11px;opacity:.75;font-weight:600}

/* company cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.tp{border-top:3px solid var(--gold)}
.card .ttl{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .ttl b{font:600 19px var(--font-display)}
.card .meta,.meta{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.drop{border:1px dashed var(--gold);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.drop:hover,.drop.over{background:var(--champagne);color:var(--ink)}
.drop input{display:none}
.progress{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-2));transition:width .3s}
.notes{font-size:12.5px;margin:0;padding-left:16px;color:var(--muted)}
.notes li{margin:2px 0}
.add{border:1px dashed var(--gold);background:transparent;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;min-height:160px;font-weight:700;border-radius:var(--r)}
.add:hover{background:var(--champagne);color:var(--ink)}

/* grid */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 260px)}
table.g{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.g th,table.g td{border-bottom:1px solid var(--line-2);padding:0;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--navy);color:#f3ecd9;z-index:2;padding:10px;font-weight:700;text-align:right;min-width:150px;max-width:190px;white-space:normal;vertical-align:bottom;border-bottom:2px solid var(--gold)}
table.g thead th:first-child{left:0;z-index:3;text-align:left}
table.g td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding:6px 10px;min-width:300px;text-align:left;border-right:1px solid var(--line)}
table.g tr.sec td{background:var(--surface-2);font:600 15px var(--font-display);padding:8px 10px;color:var(--gold-d)}
table.g tr.sec td:first-child{background:var(--surface-2)}
table.g tr.tot td{font-weight:700}
table.g tr.key td{background:var(--champagne)}
table.g td.v{text-align:right;padding:6px 10px;font-variant-numeric:tabular-nums}
table.g input.cell{width:100%;border:0;background:transparent;text-align:right;padding:6px 10px;color:var(--input);font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px}
table.g input.cell.txt{text-align:center;font-family:var(--font-body)}
table.g input.cell:focus{background:rgba(197,162,83,.1);outline:none;box-shadow:inset 0 0 0 1.5px var(--gold)}
table.g td.flag{position:relative}
table.g td.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
table.g td.signbad input{color:var(--bad)}
.ok{color:var(--good)} .no{color:var(--bad)}

/* rejection */
table.r{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface)}
table.r th{background:var(--navy);color:#f3ecd9;text-align:left;padding:10px 8px;font-weight:700;vertical-align:bottom;border-bottom:2px solid var(--gold)}
table.r td{border-bottom:1px solid var(--line-2);padding:8px;vertical-align:top}
table.r select,table.r input[type=text],table.r textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;width:100%}
table.r textarea{min-height:34px;resize:vertical;font-size:12px}
table.r input.amt{color:var(--input);text-align:right;font-variant-numeric:tabular-nums}

/* results */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--gold)}
.panel h3{margin:0;font-size:21px;font-weight:600}
.stat{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.stat span:nth-child(odd){color:var(--muted)}
.stat span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
.stat .hl{font-weight:700;color:var(--ink)}
svg.strip text{fill:var(--muted);font:11px var(--font-body)}
.basisnote{font-size:12.5px;color:var(--muted);margin:10px 0}

/* sign-in */
#authview{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.authbox{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:30px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(16,26,51,.1);text-align:center}
.authbox .mascot{width:56px;height:56px;margin:0 auto}
.authbox h1{margin:0;font-size:30px;font-weight:600;text-wrap:balance}
.authbox p{margin:0}
.autherr{color:var(--bad);font-size:13px;min-height:1em}

/* dialogs */
.modal{position:fixed;inset:0;background:rgba(16,26,51,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-top:3px solid var(--gold)}
.modal h3{margin:0;font-size:22px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.empty{color:var(--muted);padding:30px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#f3ecd9;padding:11px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.25);border:1px solid var(--gold)}

@media (max-width:900px){ .steps{grid-template-columns:1fr} }
@media (max-width:820px){
  .shell{flex-direction:column}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:220px}
  .main{padding:16px}
  .field.wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <h2>Jobs</h2>
    <div class="list" id="jobs"></div>
    <div class="foot">
      <button class="btn sm primary" data-act="new">+ New job</button>
      <button class="btn sm" data-act="dup">Duplicate</button>
      <button class="btn sm ghost danger" data-act="del">Delete</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script>/* TNMM core: model, calculation and Excel export (one benchmark year, v3 rules). */
(function (root) {
  'use strict';

  const PL_KEYS = ['rev','cos','ooi','dist','admin','staff','ooe','fv','intinc','invinc','fin','tax'];
  const PL_LABELS = {
    rev:'Revenue / Turnover', cos:'Cost of sales', gp:'Gross profit',
    ooi:'Other operating income', dist:'Distribution / selling expenses',
    admin:'Administrative expenses', staff:'Staff costs',
    ooe:'Other operating expenses', fv:'Fair value changes on investments',
    pfo:'Profit from operations', intinc:'Interest income',
    invinc:'Investing income', fin:'Finance costs',
    pbt:'Profit / (loss) before taxation', tax:'Income tax expense',
    pat:'Profit / (loss) after taxation'
  };
  const ADJ_KEYS = ['less_interest','less_dividend','adj_invest_disposal','adj_invest_fv',
    'less_rental_nonop','add_ip_depreciation','adj_nontrade_forex','less_exceptional_income','add_exceptional_expense'];
  const ADJ_LABELS = {
    less_interest:'Less: Interest income',
    less_dividend:'Less: Dividend income',
    adj_invest_disposal:'Less / add: (Gain) / loss on disposal of investments',
    adj_invest_fv:'Less / add: Fair value (gain) / loss on investments',
    less_rental_nonop:'Less: Rental income (non-operating)',
    add_ip_depreciation:'Add back: Depreciation of investment properties',
    adj_nontrade_forex:'Less / add: Non-trade foreign exchange (gain) / loss',
    less_exceptional_income:'Less: Exceptional non-recurring income',
    add_exceptional_expense:'Add back: Exceptional non-recurring expense'
  };
  /* Expected sign of each adjustment as a contribution to NormOP: -1 only negative, +1 only positive, 0 either */
  const ADJ_SIGN = { less_interest:-1, less_dividend:-1, adj_invest_disposal:0, adj_invest_fv:0,
    less_rental_nonop:-1, add_ip_depreciation:1, adj_nontrade_forex:0, less_exceptional_income:-1, add_exceptional_expense:1 };
  const BASIS = {
    YA2023:     { lo:0.375, hi:0.625, median:true,  label:'37.5th - 62.5th percentile' },
    PRE_YA2023: { lo:0.25,  hi:0.75,  median:false, label:'25th - 75th percentile (interquartile range)' }
  };
  const TESTS = [
    { key:'activity', label:'Functional comparability' },
    { key:'data',     label:'Sufficient & verifiable data' },
    { key:'special',  label:'No start-up / bankrupt / dormant' }
  ];

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[,\s]/g, '')); return isFinite(n) ? n : 0; };

  function blankCompany(isTested) {
    const pl = {}; PL_KEYS.forEach(k => pl[k] = 0);
    const adj = {}; ADJ_KEYS.forEach(k => adj[k] = 0);
    return {
      id: uid(), isTested: !!isTested, name: '', regno: '', activity: '', fye: '',
      pl, adj, adjNotes: {}, pbtReported: null,
      rpt: { sales: 0, purchases: 0 },
      tests: { activity: 'Pass', data: 'Pass', special: 'Pass' },
      reasons: {}, sizeAcceptedByIrbm: false,
      source: null, extraction: null, keptIn: [], warnings: []
    };
  }

  const LEGACY = { less_gain_quoted:'adj_invest_disposal', less_fvgain:'adj_invest_fv', add_fvloss:'adj_invest_fv', less_rental:'less_rental_nonop' };
  /* Bring a stored or imported company up to the current shape; legacy adjustment keys are mapped, unknown ones dropped. */
  function normaliseCompany(c, isTested) {
    const base = blankCompany(isTested);
    const out = { ...base, ...c, pl: { ...base.pl }, adj: { ...base.adj },
      rpt: { ...base.rpt, ...(c.rpt || {}) }, tests: { ...base.tests, ...(c.tests || {}) } };
    PL_KEYS.forEach(k => out.pl[k] = num(c.pl && c.pl[k]));
    Object.entries(c.adj || {}).forEach(([k, v]) => { const k2 = LEGACY[k] || k; if (ADJ_KEYS.includes(k2)) out.adj[k2] = num(out.adj[k2]) + num(v); });
    return out;
  }
  function normaliseJob(j) {
    const base = blankJob();
    return { ...base, ...j, tp: normaliseCompany(j.tp || {}, true), comps: (j.comps || []).map(c => normaliseCompany(c, false)) };
  }

  function blankJob() {
    return { id: uid(), title: 'New benchmarking', basis: 'YA2023', rptThreshold: 0.2,
      windowFrom: '', windowTo: '', tp: blankCompany(true), comps: [], createdAt: Date.now(), updatedAt: Date.now() };
  }

  /* ---------- calculation ---------- */
  function calcCompany(c) {
    const p = {}; PL_KEYS.forEach(k => p[k] = num(c.pl[k]));
    const gp = p.rev + p.cos;
    const pfo = gp + p.ooi + p.dist + p.admin + p.staff + p.ooe + p.fv;
    const pbt = pfo + p.intinc + p.invinc + p.fin;
    const pat = pbt + p.tax;
    const adjTotal = ADJ_KEYS.reduce((s, k) => s + num(c.adj[k]), 0);
    const normop = pbt - p.fin + adjTotal;
    const opex = -(p.dist + p.admin + p.staff + p.ooe);
    const om = p.rev === 0 ? null : normop / p.rev;
    const ncp = (p.rev - normop) === 0 ? null : normop / (p.rev - normop);
    const berry = opex === 0 ? null : gp / opex;
    const pbtCheck = (c.pbtReported === null || c.pbtReported === undefined || c.pbtReported === '')
      ? null : Math.abs(num(c.pbtReported) - pbt) < 1.5;
    return { ...p, gp, pfo, pbt, pat, adjTotal, normop, opex, om, ncp, berry, pbtCheck };
  }

  function rejection(job, c) {
    const tpRev = num(job.tp.pl.rev), rev = num(c.pl.rev), thr = num(job.rptThreshold) || 0.2;
    const sizePass = c.sizeAcceptedByIrbm || rev >= 0.1 * tpRev;
    const rptSalesPct = rev === 0 ? 0 : num(c.rpt.sales) / rev;
    const rptPurchPct = rev === 0 ? 0 : num(c.rpt.purchases) / rev;
    const rptPass = !(rptSalesPct > thr || rptPurchPct > thr);
    const t = c.tests || {};
    const failed = [];
    if (!sizePass) failed.push('Turnover below 10% of tested party');
    if (!rptPass) failed.push('Related-party transactions above ' + Math.round(thr * 100) + '%');
    TESTS.forEach(x => { if ((t[x.key] || 'Pass') !== 'Pass') failed.push(x.label); });
    return { sizePass, rptSalesPct, rptPurchPct, rptPass, accepted: failed.length === 0, failed };
  }

  /* Excel PERCENTILE.INC (linear interpolation) */
  function percentile(vals, p) {
    const a = vals.slice().sort((x, y) => x - y), n = a.length;
    if (!n) return null;
    const h = (n - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
    return a[lo] + (h - lo) * (a[hi] - a[lo]);
  }

  function results(job) {
    const b = BASIS[job.basis] || BASIS.YA2023;
    const tp = calcCompany(job.tp);
    const rows = job.comps.map(c => ({ c, calc: calcCompany(c), rej: rejection(job, c) }));
    const acc = rows.filter(r => r.rej.accepted);
    const stat = {};
    ['om', 'ncp', 'berry'].forEach(k => {
      const v = acc.map(r => r.calc[k]).filter(x => x !== null && isFinite(x));
      const lo = percentile(v, b.lo), hi = percentile(v, b.hi);
      const med = b.median && lo !== null ? (lo + hi) / 2 : null;
      const t = tp[k];
      let concl = 'n/a';
      if (t !== null && lo !== null) concl = (t >= lo && t <= hi) ? 'Within range' : (t < lo ? 'Below range' : 'Above range');
      stat[k] = { n: v.length, min: v.length ? Math.min(...v) : null, max: v.length ? Math.max(...v) : null, lo, hi, med, tp: t, concl, values: v };
    });
    return { basis: b, tp, rows, acc, stat };
  }

  /* ---------- Excel export (mirrors tnmm-benchmarking-v3 build_benchmark.py) ---------- */
  const colL = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  async function buildWorkbook(ExcelJS, job) {
    const b = BASIS[job.basis] || BASIS.YA2023;
    const thr = num(job.rptThreshold) || 0.2;
    const comps = [job.tp, ...job.comps];
    const cols = comps.map((_, i) => colL(i + 1));      // B, C, ...
    const tpCol = cols[0], compCols = cols.slice(1);
    const by = {}; comps.forEach((c, i) => by[cols[i]] = c);

    const wb = new ExcelJS.Workbook();
    wb.creator = 'TNMM Benchmarking'; wb.calcProperties.fullCalcOnLoad = true;
    const ws = wb.addWorksheet('Calculation', { views: [{ showGridLines: false, state: 'frozen', xSplit: 1 }] });

    const F = (o = {}) => ({ name: 'Arial', size: 10, ...o });
    const BLUE = F({ color: { argb: 'FF0000FF' } }), BLACK = F(), BLACKB = F({ bold: true });
    const GREEN = F({ color: { argb: 'FF008000' } }), WHITEB = F({ bold: true, color: { argb: 'FFFFFFFF' } });
    const TITLE = { name: 'Arial', size: 12, bold: true, color: { argb: 'FF1F3864' } };
    const fill = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + hex } });
    const HDRF = fill('1F3864'), SECF = fill('D9E1F2'), ACCF = fill('E2EFDA'), STATF = fill('FFF2CC'), CONCF = fill('E2EFDA'), SUBHF = fill('2F5597');
    const thin = { style: 'thin', color: { argb: 'FFBFBFBF' } }, BORD = { top: thin, left: thin, bottom: thin, right: thin };
    const NUM2 = '#,##0.00;(#,##0.00);"-"', NUM = '#,##0;(#,##0);"-"', PCT = '0.00%;(0.00%);"-"', MULT = '0.00"x"';

    function setc(sheet, coord, val, font = BLACK, fmt, fl, align, wrap, bord) {
      const c = sheet.getCell(coord);
      c.value = (typeof val === 'string' && val.startsWith('=')) ? { formula: val.slice(1) } : val;
      c.font = font;
      if (fmt) c.numFmt = fmt;
      if (fl) c.fill = fl;
      if (align || wrap) c.alignment = { horizontal: align, wrapText: !!wrap, vertical: 'middle' };
      if (bord) c.border = BORD;
      return c;
    }
    const S = (coord, val, o = {}) => setc(ws, coord, val, o.font, o.fmt, o.fill, o.align, o.wrap, o.bord);
    function section(r, text, fl = SECF, font = BLACKB, extra = []) {
      S('A' + r, text, { font, fill: fl });
      new Set([...cols, ...extra]).forEach(col => { ws.getCell(col + r).fill = fl; });
    }

    let r = 1;
    S('A' + r, 'TRANSFER PRICING BENCHMARKING ANALYSIS - TNMM', { font: TITLE }); r++;
    const sub = `Tested Party: ${job.tp.name || ''}${job.tp.regno ? ' (' + String(job.tp.regno).split(' ')[0] + ')' : ''} | FYE ${job.tp.fye || ''}`;
    S('A' + r, sub, { font: { name: 'Arial', size: 9, italic: true } }); r += 2;
    const win = (job.windowFrom && job.windowTo) ? ` (comparable FYE within ${fmtMonth(job.windowFrom)} - ${fmtMonth(job.windowTo)})` : '';
    section(r, `BENCHMARK YEAR - Tested Party FYE ${job.tp.fye || ''}${win}`, HDRF, WHITEB); r += 2;

    [['Company name', 'name', true], ['Registration No.', 'regno', false], ['Business activity', 'activity', false]].forEach(([label, key, isname]) => {
      S('A' + r, label, { font: isname ? BLACKB : BLACK });
      cols.forEach(col => S(col + r, String(by[col][key] || ''), { font: (isname && col === tpCol) ? BLACKB : BLACK, align: 'center', wrap: isname || key === 'activity' }));
      if (isname || key === 'activity') ws.getRow(r).height = 42;
      r++;
    });
    S('A' + r, 'Financial year end');
    cols.forEach(col => S(col + r, String(by[col].fye || ''), { align: 'center' }));
    r += 2;

    const rows = {};
    section(r, '1.  STATEMENT OF PROFIT OR LOSS'); r++;
    const inrow = k => { S('A' + r, PL_LABELS[k]); cols.forEach(col => S(col + r, num(by[col].pl[k]), { font: BLUE, fmt: NUM2, bord: true })); rows[k] = r++; };
    const frow = (k, fn) => { S('A' + r, PL_LABELS[k], { font: BLACKB }); cols.forEach(col => S(col + r, fn(col), { font: BLACKB, fmt: NUM2, bord: true })); rows[k] = r++; };
    inrow('rev'); inrow('cos');
    frow('gp', c => `=${c}${rows.rev}+${c}${rows.cos}`);
    ['ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].forEach(inrow);
    frow('pfo', c => '=' + ['gp', 'ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].map(k => c + rows[k]).join('+'));
    ['intinc', 'invinc', 'fin'].forEach(inrow);
    frow('pbt', c => '=' + ['pfo', 'intinc', 'invinc', 'fin'].map(k => c + rows[k]).join('+'));
    inrow('tax');
    frow('pat', c => `=${c}${rows.pbt}+${c}${rows.tax}`);
    r++;

    section(r, '2.  TNMM ADJUSTMENTS'); r++;
    S('A' + r, 'Profit / (loss) before taxation'); cols.forEach(col => S(col + r, `=${col}${rows.pbt}`, { fmt: NUM2, bord: true }));
    const adjrows = [r]; r++;
    S('A' + r, 'Add back: Finance costs'); cols.forEach(col => S(col + r, `=-${col}${rows.fin}`, { fmt: NUM2, bord: true }));
    adjrows.push(r); r++;
    ADJ_KEYS.forEach(k => { S('A' + r, ADJ_LABELS[k]); cols.forEach(col => S(col + r, num(by[col].adj[k]), { font: BLUE, fmt: NUM2, bord: true })); adjrows.push(r); r++; });
    r++;

    section(r, '3.  NORMALISED OPERATING PROFIT'); r++;
    S('A' + r, 'Normalised operating profit', { font: BLACKB });
    cols.forEach(col => S(col + r, '=' + adjrows.map(x => col + x).join('+'), { font: BLACKB, fmt: NUM2, bord: true, fill: ACCF }));
    rows.normop = r++;
    S('A' + r, 'Total operating expenses');
    cols.forEach(col => S(col + r, `=-(${col}${rows.dist}+${col}${rows.admin}+${col}${rows.staff}+${col}${rows.ooe})`, { fmt: NUM2, bord: true }));
    rows.opex = r; r += 2;

    section(r, '4.  PROFIT LEVEL INDICATORS'); r++;
    S('A' + r, 'Operating margin  (NormOP / Revenue)');
    cols.forEach(col => S(col + r, `=IF(${col}${rows.rev}=0,"",${col}${rows.normop}/${col}${rows.rev})`, { fmt: PCT, bord: true }));
    rows.ros = r++;
    S('A' + r, 'Net cost plus margin  (NormOP / (Revenue - NormOP))');
    cols.forEach(col => S(col + r, `=IF((${col}${rows.rev}-${col}${rows.normop})=0,"",${col}${rows.normop}/(${col}${rows.rev}-${col}${rows.normop}))`, { fmt: PCT, bord: true }));
    rows.ncpm = r++;
    S('A' + r, 'Berry ratio  (Gross profit / Operating expenses)');
    cols.forEach(col => S(col + r, `=IF(${col}${rows.opex}=0,"",${col}${rows.gp}/${col}${rows.opex})`, { fmt: MULT, bord: true }));
    rows.berry = r; r += 3;

    const hcols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    section(r, '5.  REJECTION CRITERIA', HDRF, WHITEB, hcols.slice(1)); r += 2;
    const heads = ['Comparable', 'Turnover', "Turnover >= 10% of tested party's revenue?", 'RPT sales %', 'RPT purchases %',
      `RPT sales and purchases each <= ${Math.round(thr * 100)}%?`, 'Functional comparability?', 'Sufficient & verifiable data?',
      'No start-up / bankrupt / dormant?', 'CONCLUSION'];
    hcols.forEach((hc, i) => S(hc + r, heads[i], { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    ws.getRow(r).height = 48;
    [['L', 'RPT sales'], ['M', 'RPT purchases']].forEach(([hc, t]) => S(hc + r, t, { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    r++;
    const TPrev = `$${tpCol}$${rows.rev}`;
    const rej = {};
    compCols.forEach(col => {
      const cc = by[col];
      S('A' + r, `${cc.name || ''}  (${String(cc.regno || '').split(' ')[0]})`, { wrap: true, bord: true });
      S('B' + r, `=${col}${rows.rev}`, { fmt: NUM, bord: true });
      if (cc.sizeAcceptedByIrbm) S('C' + r, 'Pass', { font: BLUE, align: 'center', bord: true });
      else S('C' + r, `=IF(B${r}>=0.1*${TPrev},"Pass","Fail")`, { align: 'center', bord: true });
      S('L' + r, num(cc.rpt.sales), { font: BLUE, fmt: NUM, bord: true });
      S('M' + r, num(cc.rpt.purchases), { font: BLUE, fmt: NUM, bord: true });
      S('D' + r, `=IF(B${r}=0,0,L${r}/B${r})`, { fmt: PCT, bord: true });
      S('E' + r, `=IF(B${r}=0,0,M${r}/B${r})`, { fmt: PCT, bord: true });
      S('F' + r, `=IF(OR(D${r}>${thr},E${r}>${thr}),"Fail","Pass")`, { align: 'center', bord: true });
      [['G', 'activity'], ['H', 'data'], ['I', 'special']].forEach(([hc, k]) => S(hc + r, (cc.tests && cc.tests[k]) || 'Pass', { font: BLUE, align: 'center', bord: true }));
      S('J' + r, `=IF(AND(C${r}="Pass",F${r}="Pass",G${r}="Pass",H${r}="Pass",I${r}="Pass"),"ACCEPTED","REJECTED")`, { font: BLACKB, align: 'center', bord: true });
      rej[col] = r++;
    });

    ws.getColumn('A').width = 52;
    new Set([...cols, ...hcols.slice(1)]).forEach(col => { ws.getColumn(col).width = 16; });
    ['L', 'M'].forEach(col => { ws.getColumn(col).width = 14; });

    /* Summary */
    const s = wb.addWorksheet('Summary of Interquartile', { views: [{ showGridLines: false }] });
    const SS = (coord, val, o = {}) => setc(s, coord, val, o.font, o.fmt, o.fill, o.align, o.wrap, o.bord);
    SS('A1', "SUMMARY OF ARM'S LENGTH RANGE - TNMM", { font: TITLE });
    r = 3;
    SS('A' + r, `ARM'S LENGTH RANGE - TESTED PARTY FYE ${String(job.tp.fye || '').toUpperCase()}`, { font: WHITEB, fill: HDRF });
    ['B', 'C', 'D', 'E'].forEach(col => { s.getCell(col + r).fill = HDRF; });
    r++;
    SS('A' + r, 'Range basis', { font: BLACKB }); SS('B' + r, b.label); r++;
    SS('A' + r, 'Lower percentile', { font: BLACKB }); SS('B' + r, b.lo, { font: BLUE, fmt: '0.0%' }); const loCell = `$B$${r}`;
    SS('C' + r, 'Upper percentile', { font: BLACKB }); SS('D' + r, b.hi, { font: BLUE, fmt: '0.0%' }); const hiCell = `$D$${r}`;
    r += 2;
    ['Comparable', 'Accepted?', 'Operating margin', 'Net cost plus margin', 'Berry ratio'].forEach((h, i) =>
      SS(['A', 'B', 'C', 'D', 'E'][i] + r, h, { font: WHITEB, fill: SUBHF, wrap: true, align: 'center', bord: true }));
    s.getRow(r).height = 30; r++;
    const first = r;
    compCols.forEach(col => {
      const cc = by[col];
      SS('A' + r, `${cc.name || ''} (${String(cc.regno || '').split(' ')[0]})`, { bord: true });
      SS('B' + r, `=IF(Calculation!J${rej[col]}="ACCEPTED","Yes","No")`, { font: GREEN, align: 'center', bord: true });
      SS('C' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.ros},"")`, { font: GREEN, fmt: PCT, bord: true });
      SS('D' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.ncpm},"")`, { font: GREEN, fmt: PCT, bord: true });
      SS('E' + r, `=IF($B${r}="Yes",Calculation!${col}${rows.berry},"")`, { font: GREEN, fmt: MULT, bord: true });
      r++;
    });
    const last = Math.max(first, r - 1);
    const rng = c => `${c}${first}:${c}${last}`;
    const lines = [['Minimum', 'min'], [`Lower quartile (${b.lo * 100}th percentile)`, 'lo']];
    if (b.median) lines.push(['Median', 'med']);
    lines.push([`Upper quartile (${b.hi * 100}th percentile)`, 'hi'], ['Maximum', 'max']);
    const st = {};
    lines.forEach(([lab, k]) => { SS('A' + r, lab, { font: BLACKB, fill: STATF }); st[k] = r++; });
    [['C', PCT], ['D', PCT], ['E', MULT]].forEach(([col, fmt]) => {
      const o = { font: BLACKB, fmt, fill: STATF, bord: true };
      SS(col + st.min, `=MIN(${rng(col)})`, o);
      SS(col + st.lo, `=PERCENTILE(${rng(col)},${loCell})`, o);
      SS(col + st.hi, `=PERCENTILE(${rng(col)},${hiCell})`, o);
      SS(col + st.max, `=MAX(${rng(col)})`, o);
      if (st.med) SS(col + st.med, `=(${col}${st.lo}+${col}${st.hi})/2`, o);
    });
    SS('A' + r, 'Number of accepted comparables');
    ['C', 'D', 'E'].forEach(col => SS(col + r, `=COUNT(${rng(col)})`, { fmt: '0', bord: true }));
    r++;
    SS('A' + r, `TESTED PARTY - ${job.tp.name || ''}`, { font: BLACKB, fill: CONCF }); SS('B' + r, 'Tested', { font: BLACKB, align: 'center', fill: CONCF });
    SS('C' + r, `=Calculation!${tpCol}${rows.ros}`, { font: GREEN, fmt: PCT, fill: CONCF, bord: true });
    SS('D' + r, `=Calculation!${tpCol}${rows.ncpm}`, { font: GREEN, fmt: PCT, fill: CONCF, bord: true });
    SS('E' + r, `=Calculation!${tpCol}${rows.berry}`, { font: GREEN, fmt: MULT, fill: CONCF, bord: true });
    const tpr = r++;
    SS('A' + r, 'Conclusion', { font: BLACKB });
    ['C', 'D', 'E'].forEach(col => {
      const lo = col + st.lo, hi = col + st.hi;
      SS(col + r, `=IF(${col}${tpr}="","n/a",IF(AND(${col}${tpr}>=${lo},${col}${tpr}<=${hi}),"Within range",IF(${col}${tpr}<${lo},"Below range","Above range")))`, { font: BLACKB, align: 'center', bord: true });
    });
    s.getColumn('A').width = 46;
    ['B', 'C', 'D', 'E'].forEach(col => { s.getColumn(col).width = 22; });

    return wb;
  }

  function fmtMonth(iso) {
    if (!iso) return '';
    const d = new Date(iso + (iso.length === 7 ? '-01' : ''));
    return isNaN(d) ? iso : d.toLocaleString('en-GB', { month: 'short', year: 'numeric' });
  }

  const api = { PL_KEYS, PL_LABELS, ADJ_KEYS, ADJ_LABELS, ADJ_SIGN, BASIS, TESTS, uid, num, blankCompany, blankJob, normaliseCompany, normaliseJob,
    calcCompany, rejection, percentile, results, buildWorkbook, fmtMonth };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TNMM = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* TNMM Benchmarking app UI */
(function () {
  'use strict';
  const T = window.TNMM;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (v, d = 2) => (v === null || v === undefined || !isFinite(v)) ? '–' : (Math.abs(v) < 0.005 && d === 2 ? '–' : (v < 0 ? '(' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + ')' : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })));
  const pct = v => (v === null || v === undefined || !isFinite(v)) ? '–' : (v < 0 ? '(' + (Math.abs(v) * 100).toFixed(2) + '%)' : (v * 100).toFixed(2) + '%');
  const mult = v => (v === null || v === undefined || !isFinite(v)) ? '–' : v.toFixed(2) + 'x';
  const PLI = { om: { label: 'Operating margin', f: pct }, ncp: { label: 'Net cost plus margin', f: pct }, berry: { label: 'Berry ratio', f: mult } };

  const state = {
    jobs: [], job: null, tab: 'upload', isExample: false, going: false, errors: {},
    sb: null, user: null, profile: null, ocr: {},
    saveState: 'idle', files: {}, busy: {}, aborts: {}, why: {}
  };

  /* ---------------- persistence ---------------- */
  let saveTimer = null, saving = false, saveAgain = false;
  function touch() {
    if (!state.job) return;
    state.job.updatedAt = Date.now();
    if (state.isExample) { setSave('Example: changes are not saved. Use “Save as new job” to keep it.'); return; }
    clearTimeout(saveTimer); setSave('Unsaved changes…');
    saveTimer = setTimeout(saveNow, 900);
  }
  async function saveNow() {
    const job = state.job; if (!job || state.isExample) return;
    if (!state.sb || !state.user) return;
    if (saving) { saveAgain = true; return; }
    if (!state.jobs.some(x => x.id === job.id)) state.jobs.unshift(JSON.parse(JSON.stringify(job)));
    saving = true; setSave('Saving…');
    try {
      const body = JSON.parse(JSON.stringify(job));
      await api('save', { id: job.id, title: job.title || '', job: body });
      const i = state.jobs.findIndex(x => x.id === job.id); if (i >= 0) state.jobs[i] = JSON.parse(JSON.stringify(job)); else state.jobs.unshift(JSON.parse(JSON.stringify(job)));
      renderRail();
      setSave('All changes saved');
    } catch (e) {
      setSave('Could not save: ' + (e && e.message || 'check your connection and try again'), true);
    } finally {
      saving = false;
      if (saveAgain) { saveAgain = false; saveNow(); }
    }
  }
  function localSave() { try { const all = JSON.parse(localStorage.getItem('tnmm-jobs') || '{}'); all[state.job.id] = state.job; localStorage.setItem('tnmm-jobs', JSON.stringify(all)); } catch (e) { /* storage unavailable */ } }
  function localLoad() { try { return Object.values(JSON.parse(localStorage.getItem('tnmm-jobs') || '{}')); } catch (e) { return []; } }
  function setSave(t, err) { const el = $('#save'); if (el) { el.textContent = t; el.classList.toggle('err', !!err); } }

  /* ---------------- sign-in through CCTaxLab ---------------- */
  // The CCTaxLab portal and this app share the address clowws-byte.github.io, so the portal's
  // stored sign-in is read here. The TNMM server re-checks it with CCTaxLab on every call.
  async function initAuth() {
    const cfg = window.TNMM_CONFIG;
    if (!window.supabase) { showAuth('The sign-in service could not load. Check your connection and refresh.'); return; }
    state.sb = window.supabase.createClient(cfg.cctUrl, cfg.cctKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data } = await state.sb.auth.getSession();
    await onSession(data.session);
    state.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && (!state.user || state.user.id !== (session && session.user.id)))) onSession(session);
    });
  }
  async function api(action, body, opts = {}) {
    const { data: sess } = await state.sb.auth.getSession();
    const token = sess.session && sess.session.access_token;
    const raw = body instanceof Blob;
    const r = await fetch(window.TNMM_CONFIG.apiUrl + '?action=' + action, {
      method: 'POST', signal: opts.signal,
      headers: { Authorization: 'Bearer ' + (token || ''), apikey: window.TNMM_CONFIG.apiKey, 'Content-Type': raw ? body.type : 'application/json', ...(opts.headers || {}) },
      body: raw ? body : JSON.stringify(body || {})
    });
    const out = await r.json().catch(() => ({}));
    if (r.status === 401) { onSession(null); }
    if (!r.ok) throw new Error(out.error || ('Request failed (' + r.status + ')'));
    return out;
  }
  async function onSession(session) {
    state.user = session ? session.user : null; state.profile = null;
    if (!state.user) return showAuth();
    let me;
    try { me = await api('me'); } catch (e) { return showAuth('The TNMM server could not be reached. Refresh to try again.'); }
    if (!me.ok) return me.reason === 'signin' ? showAuth() : showNoAccess(me.reason);
    state.profile = me.profile;
    showApp();
    try {
      const out = await api('list');
      onJobsLoaded((out.jobs || []).map(r => { const j = T.normaliseJob(r.job || {}); j.id = r.id; j.title = r.title || j.title; j.updatedAt = Date.parse(r.updated_at) || j.updatedAt; return j; }));
    } catch (e) { setSave('Saved jobs could not be loaded', true); onJobsLoaded([]); }
  }
  function showApp() {
    $('#authview').hidden = true; $('.shell').hidden = false; $('#dl').hidden = false; $('#who').hidden = false;
    $('#whoname').innerHTML = `<b>${esc(state.profile.name || '')}</b><small>${esc(state.profile.email || state.user.email || '')}</small>`;
    render();
  }
  function hideApp() { $('.shell').hidden = true; $('#dl').hidden = true; $('#who').hidden = true; $('#authview').hidden = false; }
  function showAuth(msg) {
    hideApp();
    $('#authview').innerHTML = `<div class="authbox">${MASCOT}<h1>Sign in through CCTaxLab</h1>
      <p>TNMM Benchmarking uses your CCTaxLab account. Sign in to the portal, then open TNMM Benchmarking from your applications.</p>
      <p class="autherr" role="alert">${esc(msg || '')}</p>
      <a class="btn primary" href="${esc(window.TNMM_CONFIG.portalUrl)}">Go to CCTaxLab</a>
      <button class="btn ghost" data-act="recheck">I've signed in, check again</button></div>`;
  }
  function showNoAccess(reason) {
    hideApp();
    $('#authview').innerHTML = `<div class="authbox">${MASCOT}<h1>${reason === 'not_approved' ? 'Account not approved' : 'No access yet'}</h1>
      <p>${reason === 'not_approved' ? 'Your CCTaxLab account is waiting for approval.' : 'Your CCTaxLab account does not have access to TNMM Benchmarking. Ask an admin to grant it in CCTaxLab → Admin → Access.'}</p>
      <p class="meta">${esc(state.user && state.user.email)}</p>
      <a class="btn" href="${esc(window.TNMM_CONFIG.portalUrl)}">Back to CCTaxLab</a>
      <button class="btn ghost" data-act="recheck">Check again</button></div>`;
  }
  let firstLoad = true;
  function onJobsLoaded(jobs) {
    firstLoad = true;
    state.jobs = jobs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (firstLoad) {
      firstLoad = false;
      if (state.jobs.length) openJob(state.jobs[0].id); else startFresh();
    } else if (state.job && !state.isExample && !saving) {
      // keep the open job; refresh only the list
    }
    renderRail();
  }

  /* ---------------- job actions ---------------- */
  /* A blank job kept in memory; it is saved on the first change. */
  function startFresh() { const j = T.blankJob(); j.id = crypto.randomUUID(); j.title = 'New benchmarking'; j.basis = 'YA2023'; j.windowMode = '6-6'; state.job = j; state.isExample = false; state.tab = 'upload'; render(); }
  function openJob(id) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); }
    const cur = state.job && !state.isExample ? state.jobs.findIndex(x => x.id === state.job.id) : -1;
    if (cur >= 0) state.jobs[cur] = state.job;
    const j = state.jobs.find(x => x.id === id); if (!j) return;
    state.job = T.normaliseJob(JSON.parse(JSON.stringify(j))); state.isExample = false; state.files = {}; state.ocr = {}; state.errors = {};
    state.tab = (j.tp && T.num(j.tp.pl.rev)) || (j.comps || []).length ? 'results' : 'upload'; render();
  }
  function newJob() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saveNow(); }
    startFresh();
  }
  function saveExampleAsNew() {
    const j = T.normaliseJob(JSON.parse(JSON.stringify(state.job))); j.id = crypto.randomUUID(); j.title = (j.title || 'Benchmarking').replace(/\s*\(example\)\s*/i, '') + ' (copy)';
    state.jobs.unshift(j); state.job = j; state.isExample = false; touch(); render(); toast('Saved as a new job');
  }
  function duplicateJob() {
    const j = T.normaliseJob(JSON.parse(JSON.stringify(state.job))); j.id = crypto.randomUUID(); j.title = (j.title || '') + ' (copy)'; j.createdAt = Date.now();
    state.jobs.unshift(j); state.job = j; state.isExample = false; touch(); render(); toast('Job duplicated');
  }
  function deleteJob() {
    const j = state.job; if (!j || state.isExample) return;
    confirmBox('Delete this job?', `“${esc(j.title)}” and its figures will be removed. Uploaded PDFs are never stored, so nothing else is affected.`, 'Delete job', async () => {
      state.jobs = state.jobs.filter(x => x.id !== j.id);
      try { await api('delete', { id: j.id }); } catch (e) { toast('Could not delete the job: ' + e.message); }
      if (state.jobs.length) openJob(state.jobs[0].id); else startFresh();
    });
  }

  /* ---------------- rendering ---------------- */
  function render() {
    const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
    renderRail(); renderMain();
    if (fid) { const el = document.querySelector(`[data-fid="${CSS.escape(fid)}"]`); if (el) { el.focus(); if (el.select) try { el.select(); } catch (e) { /* not selectable */ } } }
  }

  /* Same rule as the database clean-up: removed after 3 full working days (Mon-Fri) since the last change. */
  function deleteDate(ts) {
    const d = new Date(ts || Date.now()); d.setHours(0, 0, 0, 0);
    let n = 0; while (n < 3) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
    d.setDate(d.getDate() + 1);
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  const MASCOT = document.querySelector('.mascot') ? document.querySelector('.mascot').outerHTML : '';
  const ICON_TP = '<svg viewBox="0 0 48 48" width="40" height="40"><rect x="9" y="5" width="30" height="38" rx="7" fill="#fff" stroke="currentColor" stroke-width="3"/><path d="M17 17h14M17 24h14M17 31h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="36" cy="36" r="8" fill="currentColor"/><path d="M36 32v8M32 36h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
  const ICON_CP = '<svg viewBox="0 0 48 48" width="40" height="40"><rect x="14" y="4" width="26" height="33" rx="6" fill="#fff" stroke="currentColor" stroke-width="3" opacity=".55"/><rect x="8" y="10" width="26" height="33" rx="6" fill="#fff" stroke="currentColor" stroke-width="3"/><path d="M14 21h14M14 28h14M14 35h7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
  function renderRail() {
    const list = $('#jobs'); if (!list) return;
    const items = state.jobs.map(j => `<button class="job ${state.job && !state.isExample && state.job.id === j.id ? 'on' : ''}" data-job="${esc(j.id)}"><b>${esc(j.title || 'Untitled')}</b><small>${esc(j.tp && j.tp.name || 'No tested party yet')}</small><small class="del">Deletes ${esc(deleteDate(j.updatedAt))}</small></button>`).join('');
    list.innerHTML = (items || '<p class="empty" style="padding:12px">No saved jobs yet. Your jobs appear here once you start one.</p>')
      + '<p class="railnote">Jobs are deleted automatically 3 working days after their last change. Download the Excel to keep a copy.</p>';
  }

  function renderMain() {
    const m = $('#main'); const job = state.job; if (!job) { m.innerHTML = '<p class="empty">Loading…</p>'; return; }
    const R = T.results(job);
    const accN = R.acc.length;
    m.innerHTML = `
      ${headerHtml(job)}
      ${hasFigures(job) ? tilesHtml(R) : ''}
      <div class="tabs" role="tablist">
        ${[['upload', 'Upload & Go'], ['companies', 'Companies', 1 + job.comps.length], ['calc', 'Calculation'], ['reject', 'Rejection', hasFigures(job) && job.comps.length ? accN + '/' + job.comps.length + ' accepted' : undefined], ['results', 'Results']]
          .map(([k, l, c]) => { const ok = stepDone(job, R, k); return `<button role="tab" data-tab="${k}" class="${state.tab === k ? 'on' : ''} ${ok ? 'done' : ''}">${ok ? '<span class="tick" aria-label="done">✓</span>' : ''}${l}${c !== undefined ? `<span class="count">${esc(c)}</span>` : ''}</button>`; }).join('')}
      </div>
      <section id="tabbody">${state.tab === 'upload' ? uploadHtml(job) : state.tab === 'companies' ? companiesHtml(job) : state.tab === 'calc' ? calcHtml(job, R) : state.tab === 'reject' ? rejectHtml(job, R) : resultsHtml(job, R)}</section>`;
    $('#dl').disabled = !job.tp.name && !job.comps.length;
  }

  function headerHtml(job) {
    return `<div class="head"><div class="headttl"><span class="stepno">1</span><b>Set up</b></div>
      <div class="field wide"><label for="f-title">Job title</label><input id="f-title" data-fid="title" data-job-field="title" value="${esc(job.title)}"></div>
      <div class="field"><label for="f-tpfye">Tested party FYE</label><input id="f-tpfye" type="date" data-fid="tpfye" data-fyedate="1" value="${esc(fyeIso(job))}"></div>
      <div class="field wide"><label>Arm's length range</label><div class="seg" role="group">
        <button data-basis="PRE_YA2023" class="${job.basis === 'PRE_YA2023' ? 'on' : ''}">25th – 75th percentile</button>
        <button data-basis="YA2023" class="${job.basis === 'YA2023' ? 'on' : ''}">37.5th – 62.5th percentile</button></div></div>
      <div class="field wide"><label>Comparable period</label><div class="seg" role="group">
        <button data-wmode="6-6" class="${(job.windowMode || '6-6') === '6-6' ? 'on' : ''}">−6 / +6 months</button>
        <button data-wmode="7-5" class="${job.windowMode === '7-5' ? 'on' : ''}">−7 / +5 months</button></div>
        ${job.windowFrom && job.windowTo ? `<div class="row period"><label for="f-wfrom" class="meta">From</label><input id="f-wfrom" type="date" data-fid="wfrom" data-job-field="windowFrom" value="${esc(isoDay(job.windowFrom, false))}">
          <label for="f-wto" class="meta">to</label><input id="f-wto" type="date" data-fid="wto" data-job-field="windowTo" value="${esc(isoDay(job.windowTo, true))}"></div>` : '<small class="meta">Pick the tested party FYE to set the period</small>'}</div>
      <div class="field"><label for="f-rpt">RPT threshold</label><div class="row"><input id="f-rpt" class="num" data-fid="rpt" data-job-field="rptThreshold" value="${esc(Math.round(T.num(job.rptThreshold) * 100))}" inputmode="decimal"><span>%</span></div></div>
    </div>`;
  }

  function concChip(c) { return c === 'Within range' ? `<span class="chip good">${c}</span>` : c === 'n/a' ? `<span class="chip mute">Not enough data</span>` : `<span class="chip ${c === 'Below range' ? 'bad' : 'warn'}">${c}</span>`; }
  function tilesHtml(R) {
    return `<div class="tiles">${Object.entries(PLI).map(([k, p]) => {
      const s = R.stat[k];
      return `<div class="tile"><h3>${p.label}</h3><div class="lcd"><div class="big">${p.f(s.tp)}</div>
        <div class="rng">Range ${p.f(s.lo)} – ${p.f(s.hi)}${s.med !== null ? ' · median ' + p.f(s.med) : ''} · n = ${s.n}</div></div>${concChip(s.concl)}</div>`;
    }).join('')}</div>`;
  }

  /* ---- companies tab ---- */
  function companiesHtml(job) {
    const canRead = !!state.user;
    const cards = [job.tp, ...job.comps].map(c => companyCard(c, canRead)).join('');
    return `<div class="cards" style="margin-top:12px">${cards}<button class="card add" data-act="add-comp">+ Add comparable</button></div>`;
  }
  function statusChip(c) {
    if (state.busy[c.id]) return '<span class="chip warn">Reading…</span>';
    if (c.extraction && c.extraction.at) return c.extraction.checked ? '<span class="chip good">Checked</span>' : '<span class="chip warn">Read by OCR · check figures</span>';
    if (T.num(c.pl.rev)) return '<span class="chip mute">Entered manually</span>';
    return '<span class="chip mute">No figures yet</span>';
  }
  function companyCard(c, canRead) {
    const k = T.calcCompany(c);
    const f = state.files[c.id];
    const busy = state.busy[c.id];
    const tie = k.pbtCheck === null ? '' : k.pbtCheck ? '<span class="ok">✓ PBT agrees to accounts</span>' : `<span class="no">✗ PBT ${fmt(k.pbt)} differs from accounts ${fmt(T.num(c.pbtReported))}</span>`;
    const warns = (c.warnings || []).map(w => `<li>${esc(w)}</li>`).join('');
    const kept = (c.keptIn || []).map(w => `<li>${esc(w.item)}${w.amount ? ' (' + fmt(T.num(w.amount)) + ')' : ''}: ${esc(w.reason || 'kept in operating profit')}</li>`).join('');
    return `<div class="card ${c.isTested ? 'tp' : ''}" data-cid="${esc(c.id)}">
      <div class="ttl"><div><div class="meta">${c.isTested ? 'Tested party' : 'Comparable'}</div><b>${esc(c.name || (c.isTested ? 'Tested party' : 'New comparable'))}</b></div>${statusChip(c)}</div>
      <div class="kv"><span>Reg. no.</span><span>${esc(c.regno || '–')}</span><span>FYE</span><span>${esc(c.fye || '–')}</span>
        <span>Revenue</span><span class="num">${fmt(k.rev)}</span><span>Operating margin</span><span class="num">${pct(k.om)}</span></div>
      ${tie ? `<div style="font-size:12.5px">${tie}</div>` : ''}
      ${canRead ? (busy ? `<div class="progress"><span>${esc(busy.msg)}</span><button class="btn sm" data-act="stop" data-id="${esc(c.id)}">Stop</button></div><div class="bar"><i style="width:${Math.round((busy.p || 0.05) * 100)}%"></i></div>`
        : `<label class="drop" data-drop="${esc(c.id)}">${f ? `<b>${esc(f.name)}</b> · ${(f.size / 1048576).toFixed(1)} MB<br>Drop another file to replace` : 'Upload audited accounts (PDF or page images)<br>or drop the file here'}<input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.pptx,.xlsx,.xlsm,.csv,.txt" ${f ? '' : ''} data-file="${esc(c.id)}"></label>
        ${f ? `<button class="btn primary" data-act="extract" data-id="${esc(c.id)}">Read figures</button>` : ''}${state.ocr[c.id] ? ` <button class="btn sm" data-act="view-ocr" data-id="${esc(c.id)}">View OCR text</button>` : ''}`) : ''}
      ${warns ? `<div><div class="meta">Points to check</div><ul class="notes">${warns}</ul></div>` : ''}
      ${kept ? `<div><div class="meta">Kept in operating profit</div><ul class="notes">${kept}</ul></div>` : ''}
      <div class="row" style="justify-content:space-between">
        ${c.extraction && c.extraction.at && !c.extraction.checked ? `<button class="btn sm" data-act="mark-checked" data-id="${esc(c.id)}">Mark figures as checked</button>` : '<span></span>'}
        ${c.isTested ? '' : `<button class="btn sm ghost danger" data-act="remove-comp" data-id="${esc(c.id)}">Remove</button>`}
      </div>
    </div>`;
  }

  /* ---- calculation tab ---- */
  function calcHtml(job, R) {
    const cs = [job.tp, ...job.comps];
    const K = Object.fromEntries(cs.map(c => [c.id, T.calcCompany(c)]));
    const head = `<tr><th>Line</th>${cs.map(c => `<th>${esc(c.name || (c.isTested ? 'Tested party' : 'Comparable'))}${c.isTested ? '<br><small style="color:#9fd8f2">Tested party</small>' : ''}</th>`).join('')}</tr>`;
    const txtRow = (label, key) => `<tr><td>${label}</td>${cs.map(c => `<td class="in"><input class="cell txt" data-fid="${c.id}-${key}" data-c="${c.id}" data-k="${key}" value="${esc(c[key])}"></td>`).join('')}</tr>`;
    const inRow = (label, key, group) => `<tr><td>${label}</td>${cs.map(c => {
      const v = group === 'pl' ? c.pl[key] : c.adj[key];
      const note = group === 'adj' && c.adjNotes && c.adjNotes[key];
      const sgn = group === 'adj' ? T.ADJ_SIGN[key] : 0; const n = T.num(v);
      const bad = (sgn < 0 && n > 0) || (sgn > 0 && n < 0);
      return `<td class="in ${note ? 'flag' : ''} ${bad ? 'signbad' : ''}" ${note ? `title="${esc(note)}"` : bad ? 'title="Check the sign of this adjustment"' : ''}><input class="cell" inputmode="decimal" data-fid="${c.id}-${group}-${key}" data-c="${c.id}" data-g="${group}" data-k="${key}" value="${n ? fmt(n) : ''}" placeholder="–"></td>`;
    }).join('')}</tr>`;
    const cRow = (label, fn, cls = 'tot') => `<tr class="${cls}"><td>${label}</td>${cs.map(c => `<td class="v num">${fn(K[c.id], c)}</td>`).join('')}</tr>`;
    const sec = t => `<tr class="sec"><td>${t}</td>${cs.map(() => '<td></td>').join('')}</tr>`;
    const P = T.PL_LABELS;
    return `<p class="basisnote">Blue figures are inputs from the audited accounts; type over any of them. Black figures are calculated. A dot marks an adjustment with a reason from the reading step (hover to read it).</p>
    <div class="gridwrap"><table class="g"><thead>${head}</thead><tbody>
      ${txtRow('Company name', 'name')}${txtRow('Registration no.', 'regno')}${txtRow('Business activity', 'activity')}${txtRow('Financial year end', 'fye')}
      ${sec('1.  Statement of profit or loss')}
      ${inRow(P.rev, 'rev', 'pl')}${inRow(P.cos, 'cos', 'pl')}${cRow(P.gp, k => fmt(k.gp))}
      ${['ooi', 'dist', 'admin', 'staff', 'ooe', 'fv'].map(k => inRow(P[k], k, 'pl')).join('')}
      ${cRow(P.pfo, k => fmt(k.pfo))}

  function stripSvg(R, k, f) {
    const s = R.stat[k]; const pts = R.acc.map(r => ({ v: r.calc[k], n: r.c.name })).filter(x => x.v !== null && isFinite(x.v));

  /* ---------------- edits ---------------- */
  function findCo(id) { const j = state.job; return j.tp.id === id ? j.tp : j.comps.find(c => c.id === id); }
  function onChange(e) {
    const t = e.target, job = state.job; if (!job) return;
    if (t.dataset.jobField) {
      const f = t.dataset.jobField; job[f] = f === 'rptThreshold' ? (T.num(t.value) / 100 || 0.2) : t.value;
    } else if (t.dataset.fyedate) {

    } else if (t.dataset.c) {

      else if (t.dataset.g === 'adj') c.adj[t.dataset.k] = T.num(t.value);

      else if (t.dataset.test) c.tests[t.dataset.test] = t.value;

  async function onClick(e) {

    if (b.dataset.tab) { state.tab = b.dataset.tab; return render(); }
    if (b.dataset.basis) { state.job.basis = b.dataset.basis; touch(); return render(); }
    if (b.dataset.wmode) { state.job.windowMode = b.dataset.wmode; suggestWindow(true); touch(); return render(); }
    const act = b.dataset.act; if (!act) return;
    const id = b.dataset.id;
    if (act === 'recheck') { const { data } = await state.sb.auth.getSession(); return onSession(data.session); }
    if (act === 'new') return newJob();
    if (act === 'dup') return duplicateJob();
    if (act === 'del') return deleteJob();

    if (act === 'suggest-window') return suggestWindow();
    if (act === 'extract') return extract(id);
    if (act === 'go') return goAll();
    if (act === 'drop-file') { const c = findCo(id); delete state.files[id]; delete state.errors[id]; if (c && !c.isTested && !T.num(c.pl.rev)) state.job.comps = state.job.comps.filter(x => x.id !== id); touch(); return render(); }
    if (act === 'view-ocr') return viewOcr(id);
    if (act === 'stop') { const a = state.aborts[id]; if (a) a.abort(); return; }
    if (act === 'mark-checked') { const c = findCo(id); c.extraction.checked = true; touch(); return render(); }
  }
  function fyeIso(job) {
    if (job.tp.fyeDate) return job.tp.fyeDate;
    const d = parseFye(job.tp.fye); if (!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  /* windows saved before dates were used are 'YYYY-MM'; show them as the first or last day of the month */
  function isoDay(v, end) { if (!v) return ''; if (/^\d{4}-\d{2}$/.test(v)) { const [y, m] = v.split('-').map(Number); return end ? `${v}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}` : `${v}-01`; } return v; }
  function fmtFye(iso) { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  /* Comparable FYE window: -6/+6 months (MTPG 2024 para 4.7) or -7/+5 months (Example 4.2) around the tested party FYE. */
  function suggestWindow(silent) {
    const iso = fyeIso(state.job); const d = iso ? new Date(iso + 'T00:00:00') : null;
    if (!d || isNaN(d)) { if (!silent) toast('Pick the tested party FYE first.'); return; }
    const [before, after] = state.job.windowMode === '7-5' ? [7, 5] : [6, 6];
    const from = new Date(d.getFullYear(), d.getMonth() - (before - 1), 1), to = new Date(d.getFullYear(), d.getMonth() + after, 1);
    const day = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    state.job.windowFrom = day(from); state.job.windowTo = day(new Date(to.getFullYear(), to.getMonth() + 1, 0));
    if (silent) return;
    touch(); render();
  }
  function parseFye(s) { if (!s) return null; const d = new Date(String(s).replace(/(\d+)(st|nd|rd|th)/, '$1')); return isNaN(d) ? null : d; }

  /* ---------------- files & extraction (read in the browser; Gemini on the server as fallback) ---------------- */
  const EXT_MIME = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' };
  /* How a file is read: 'ocr' (read in the browser, else server OCR), 'sheet' (Excel, read here), 'text' (CSV / text, read here). */
  function fileMode(f) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (EXT_MIME[ext]) return { mode: 'ocr', mime: EXT_MIME[ext] };
    if (['xlsx', 'xlsm'].includes(ext)) return { mode: 'sheet' };
    if (['csv', 'txt', 'tsv', 'md'].includes(ext)) return { mode: 'text' };
    if (['xls', 'doc', 'ppt'].includes(ext)) return { error: `${f.name}: this older format can't be read. Save it as .${ext}x or PDF and upload again.` };
    if (/^image\//.test(f.type)) return { error: `${f.name}: save the image as PNG or JPEG and upload again.` };
    return { error: `${f.name}: this file type can't be read. Use PDF, Word, PowerPoint, Excel, CSV or an image.` };
  }
  function okFile(f) {
    const m = fileMode(f); if (m.error) { toast(m.error); return false; }
    if (f.size > 50 * 1048576) { toast(`${f.name} is over 50 MB. Upload only the financial statements pages.`); return false; }
    return true;
  }
  async function localPages(f) {
    const m = fileMode(f);
    if (m.mode === 'text') { const t = await f.text(); return [{ index: 0, markdown: t.slice(0, 200000) }]; }
    const wb = new window.ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const pages = [];
    wb.eachSheet((ws, i) => {
      const lines = [];
      ws.eachRow({ includeEmpty: false }, row => {
        const cells = []; row.eachCell({ includeEmpty: true }, c => { let v = c.value; if (v && typeof v === 'object') v = v.result ?? v.text ?? (v.richText ? v.richText.map(r => r.text).join('') : ''); cells.push(v === null || v === undefined ? '' : String(v)); });
        if (cells.some(x => x.trim())) lines.push('| ' + cells.join(' | ') + ' |');
      });
      if (lines.length) pages.push({ index: pages.length, markdown: `Sheet: ${ws.name}\n` + lines.join('\n') });
    });
    return pages;
  }
  function onFile(id, fileList) {
    if (id === 'tp') id = state.job.tp.id;
    if (id === 'comps') {
      const files = Array.from(fileList || []).filter(okFile);
      files.forEach(f => {
        const c = T.blankCompany(false); c.name = f.name.replace(/\.(pdf|png|jpe?g|webp)$/i, ''); c.source = { file: f.name };
        state.job.comps.push(c); state.files[c.id] = { file: f, name: f.name, size: f.size };
      });
      if (files.length) { touch(); render(); }
      return;
    }
    const f = (fileList || [])[0]; if (!f) return;
    if (!okFile(f)) return;
    state.files[id] = { file: f, name: f.name, size: f.size };
    delete state.ocr[id];
    const c = findCo(id); c.source = { file: f.name }; touch(); render();
  }
  function setBusy(id, msg, p) { state.busy[id] = { msg, p }; if (state.tab === 'companies' || state.tab === 'upload') renderMain(); }

  /* Pick the pages that matter from the OCR text: the profit or loss statement and the notes behind it. */
  // How much a page looks like the statement of profit or loss itself (works on noisy OCR text and any title wording)
  function plScore(md) {
    const t = String(md || '').toLowerCase(); let s = 0;
    if (/revenue|turnover|\bsales\b/.test(t)) s += 3;
    if (/cost\s*of\s*(sales|goods)/.test(t)) s += 4;
    if (/gross\s*(profit|loss)/.test(t)) s += 4;
    if (/before\s*tax/.test(t)) s += 4;
    if (/administrative|distribution|selling|operating expenses/.test(t)) s += 2;
    s += Math.min(6, ((t.match(/\(?\d{1,3}(,\d{3})+\)?/g) || []).length) / 5);
    if (/financial position|cash flows?|changes in equity|retained (earnings|profits)/.test(t)) s -= 5;
    if (/directors'? report|auditors'? report|report on the audit/.test(t)) s -= 6;
    return s;
  }
  function scorePage(md, i) {
    const t = md.toLowerCase(); let s = 0;
    if (/statements? of (profit or loss|comprehensive income)|income statement|profit and loss|statement of income/.test(t) && /revenue|turnover|sales/.test(t) && /before tax/.test(t)) s += 10;
    else if (plScore(md) >= 15) s += 10;
    if (/(profit|loss) before tax/.test(t) && /(after charging|arrived at|crediting)/.test(t)) s += 8;
    if (/related part/.test(t)) s += 7;
    if (/other (operating )?income/.test(t)) s += 3;
    if (/income tax expense|tax expense|taxation/.test(t)) s += 2;
    if (/finance costs?|interest income|finance income/.test(t)) s += 2;
    if (/revenue|cost of sales/.test(t)) s += 1;
    if (i < 3 && /(registration no|company no|\(\d{5,7}-[a-z]\))/.test(t)) s += 5;
    if (/principal activit/.test(t)) s += 4;
    if (/statements? of financial position/.test(t) && s < 10) s -= 2;
    if (/statements? of (changes in equity|cash flows)/.test(t) && s < 10) s -= 3;
    return s;
  }
  // Upload straight to private Storage with a one-time link (shows progress; does not pass through the API).
  function uploadDirect(url, blob, signal, onPct) {
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('PUT', url);
      x.setRequestHeader('apikey', window.TNMM_CONFIG.apiKey);
      x.setRequestHeader('Content-Type', blob.type);
      x.setRequestHeader('x-upsert', 'true');
      x.upload.onprogress = e => { if (e.lengthComputable) onPct(Math.round(e.loaded / e.total * 100)); };
      x.onload = () => x.status >= 200 && x.status < 300 ? resolve() : reject(new Error('Upload failed (' + x.status + '): ' + (x.responseText || '').slice(0, 160)));
      x.onerror = () => reject(new Error('Upload failed. Check your internet connection and try again.'));
      x.ontimeout = () => reject(new Error('Upload timed out. Try again.'));
      signal.addEventListener('abort', () => { x.abort(); reject(new DOMException('Stopped', 'AbortError')); }, { once: true });
      x.send(blob);
    });
  }

  /* ---------- Free reading in the browser ----------
     1) Digital PDFs: read the text layer with pdf.js (exact, instant, free).
     2) Scanned pages / images: free OCR with Tesseract.js, in the browser.
     Returns null when the result looks too poor, so the caller can fall back to server OCR (Gemini). */
  const LIB = {
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    tess: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
  };
  const scripts = {};
  function loadScript(src) {
    return scripts[src] || (scripts[src] = new Promise((res, rej) => {
      const el = document.createElement('script'); el.src = src; el.async = true;
      el.onload = res; el.onerror = () => { delete scripts[src]; rej(new Error('Could not load ' + src)); };
      document.head.appendChild(el);
    }));
  }
  // A small pool of free OCR workers (2-3, by CPU) so several pages are read at the same time.
  let poolP = null;
  function tessPool() {
    return poolP || (poolP = (async () => {
      await loadScript(LIB.tess);
      const n = Math.max(1, Math.min(3, Math.floor((navigator.hardwareConcurrency || 2) / 2)));
      const ws = await Promise.all(Array.from({ length: n }, async () => {
        const w = await window.Tesseract.createWorker('eng');
        await w.setParameters({ preserve_interword_spaces: '1' });
        return w;
      }));
      const idle = [...ws], waiting = [];
      return {
        size: n,
        async run(fn) {
          const w = idle.pop() || await new Promise(r => waiting.push(r));
          try { return await fn(w); } finally { const nx = waiting.shift(); if (nx) nx(w); else idle.push(w); }
        }
      };
    })().catch(e => { poolP = null; throw e; }));
  }
  async function ocrPage(doc, i, scale, w) {
    const page = await doc.getPage(i + 1);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    const { data } = await w.recognize(cv);
    cv.width = cv.height = 0; page.cleanup();
    return data;
  }
  function goodText(t) {
    const s = String(t || '').replace(/\s/g, '');
    if (s.length < 60) return false;
    const ok = (s.match(/[A-Za-z0-9.,()%\-'&:\/]/g) || []).length;
    return ok / s.length > 0.85;
  }
  // rebuild lines (and keep column gaps) from pdf.js text items
  function linesFromItems(items) {
    const rows = [];
    for (const it of items) {
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || 8;
      let r = rows.find(r => Math.abs(r.y - y) < Math.max(r.h, h) * 0.5);
      if (!r) { r = { y, h, items: [] }; rows.push(r); }
      r.items.push({ x, w: it.width || 0, s: it.str });
    }

      for (const t of r.items) {

      const r = indexedDB.open('tnmm-reads', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('pages');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  const stopIf = signal => { if (signal.aborted) throw new DOMException('Stopped', 'AbortError'); };

        const pool = await tessPool(); stopIf(signal);
        const data = await pool.run(async w => (await w.recognize(file)).data);
        if (data.confidence >= 55 && goodText(data.text)) return [{ index: 0, markdown: data.text }];
        state.why[id] = `image too unclear for free OCR (confidence ${Math.round(data.confidence)}%)`; return null;
      }
      setBusy(id, 'Opening the PDF…', 0.08);
      await loadScript(LIB.pdf);
      const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;

        const chars = text.replace(/\s/g, '').length;

      }

      const hasPL = pages.some(p => scorePage(p.markdown, p.index) >= 10);

        })));

        const found = ranked[0] && ranked[0].s >= 5;

  }
  /* Paid fallback: OCR on the server (Gemini) (used only when the free reading in the browser isn't good enough). */
  async function serverOcr(id, f, fm, ctl) {
    setBusy(id, 'Checking the file…', 0.08);
    const buf = await f.file.arrayBuffer();
    const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))).map(x => x.toString(16).padStart(2, '0')).join('');
    const why = state.why[id] || 'server OCR';
    const st = await api('ocr_start', { name: f.name, mime: fm.mime, size: f.file.size, hash, why }, { signal: ctl.signal });
    if (st.reused) setBusy(id, 'This file was already read today. Reusing that OCR, no new charge…', 0.5);
    else {
      await uploadDirect(st.upload, new Blob([buf], { type: fm.mime }), ctl.signal, pct => setBusy(id, `Uploading the file (${pct}%)…`, 0.08 + pct / 100 * 0.12));
      await api('ocr_go', { run: st.run }, { signal: ctl.signal });
    }
    const t0 = Date.now();
    for (;;) {
      await new Promise((res, rej) => { const tm = setTimeout(res, 3000); ctl.signal.addEventListener('abort', () => { clearTimeout(tm); rej(new DOMException('Stopped', 'AbortError')); }, { once: true }); });

      const r = await api('ocr_status', { run: st.run }, { signal: ctl.signal });
      if (r.status === 'done') return r.pages || [];
      if (r.status === 'error') throw new Error(`Free reading not possible (${why}), and paid OCR failed: ${r.error || 'unknown error'}`);
      if (secs > 600) throw new Error('OCR is taking too long. Try a smaller file with only the financial statements pages.');
    }

  async function extract(id, quiet) {
    const job = state.job, c = findCo(id), f = state.files[id];
    if (!c || !f || state.busy[id]) return;
    const ctl = new AbortController(); state.aborts[id] = ctl;
    try {
      let pages = state.ocr[id] ? state.ocr[id].pages : null;
      const key = pages ? null : await fileKey(f.file).catch(() => null);
      if (!pages && key) { pages = await cacheGet(key); if (pages) { setBusy(id, 'Already read on this computer. Using the saved text…', 0.6); state.ocr[id] = { file: f.name, pages }; } }
      if (!pages) {
        const fm = fileMode(f.file);
        if (fm.mode === 'ocr' && (fm.mime === 'application/pdf' || fm.mime.startsWith('image/'))) {
          delete state.why[id];
          pages = await browserRead(f.file, fm.mime, id, ctl.signal);
          if (!pages) pages = await serverOcr(id, f, fm, ctl);
        } else if (fm.mode === 'ocr') {
          pages = await serverOcr(id, f, fm, ctl);
        } else {
          setBusy(id, 'Reading the spreadsheet…', 0.3);
          pages = await localPages(f.file);
        }
        if (!pages.length) throw new Error('OCR returned no text. Check the file is the audited accounts.');
        state.ocr[id] = { file: f.name, pages };
        if (key) cachePut(key, pages);
      }
      const ranked = pages.map((p, i) => ({ p, s: scorePage(p.markdown, i) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 14).map(x => x.p);
      const pick = (ranked.length ? ranked : pages.slice(0, 14)).sort((a, b) => a.index - b.index);
      setBusy(id, `Mapping figures from page${pick.length === 1 ? '' : 's'} ${pick.map(p => p.index + 1).join(', ')}…`, 0.65);
      const win = job.windowFrom && job.windowTo ? `between ${fmtFye(isoDay(job.windowFrom, false))} and ${fmtFye(isoDay(job.windowTo, true))}` : '';
      const out = await api('extract', { pages: pick, role: c.isTested ? 'tested' : 'comparable', fye: job.tp.fye, window: win, kind: c.docKind === 'management' ? 'management' : 'audited' }, { signal: ctl.signal });
      applyExtraction(c, out.result, pick.map(p => p.index + 1));
      // No revenue found: the profit or loss page was probably not among the pages sent. Try once more with
      // the pages that look most like that statement (by figures and line names), plus the notes already used.
      if (!T.num(c.pl.rev) && pages.length > pick.length) {
        const used = new Set(pick.map(p => p.index));
        const pl = pages.filter(p => !used.has(p.index)).map(p => ({ p, s: plScore(p.markdown) })).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.p);
        const again = [...pl, ...pick].slice(0, 18).sort((a, b) => a.index - b.index);
        setBusy(id, `Profit or loss statement not found. Trying pages ${pl.map(p => p.index + 1).join(', ')}…`, 0.8);
        const out2 = await api('extract', { pages: again, role: c.isTested ? 'tested' : 'comparable', fye: job.tp.fye, window: win, kind: c.docKind === 'management' ? 'management' : 'audited' }, { signal: ctl.signal });
        if (out2 && out2.result && T.num((out2.result.pl || {}).rev)) applyExtraction(c, out2.result, again.map(p => p.index + 1));
      }
      if (!T.num(c.pl.rev)) c.warnings = [...(c.warnings || []), 'Revenue was not found. Open "View OCR text" to check the statement of profit or loss was read, or enter the figures by hand.'];
      delete state.errors[id];

  async function goAll() {
    const job = state.job;
    const ids = [job.tp, ...job.comps].filter(c => state.files[c.id] && !(c.extraction && c.extraction.at)).map(c => c.id);
    if (!state.files[job.tp.id] && !T.num(job.tp.pl.rev)) return toast('Upload the tested party accounts first.');
    if (!job.comps.length) return toast('Upload at least one comparable.');
    if (!ids.length) { state.tab = 'results'; return render(); }
    state.going = true; render();
    let i = 0;
    const worker = async () => { while (i < ids.length) { const id = ids[i++]; await extract(id, true); } };
    await Promise.all([worker(), worker()]);
    state.going = false;
    const failed = ids.filter(id => state.errors[id]).length;
    if (!failed) state.tab = 'results';
    render();
    toast(failed ? `${ids.length - failed} read, ${failed} could not be read. See the list for details.` : 'All figures read. Check them in Companies and Calculation.');
  }
  /* A step is done when: files all read (Upload), every company has figures (Companies), every PBT check that was entered agrees
     (Calculation), at least one comparable is accepted (Rejection), and a range exists (Results). */
  function stepDone(job, R, k) {
    const all = [job.tp, ...job.comps];
    const filled = job.comps.length > 0 && all.every(c => T.num(c.pl.rev) !== 0);
    if (k === 'upload') return filled && !all.some(c => state.files[c.id] && !(c.extraction && c.extraction.at)) && !Object.keys(state.errors).length;
    if (k === 'companies') return filled;
    if (k === 'calc') return filled && all.every(c => T.calcCompany(c).pbtCheck !== false);
    if (k === 'reject') return filled && R.acc.length > 0;
    if (k === 'results') return filled && R.stat.om.n > 0 && R.stat.om.lo !== null;
    return false;
  }
  function hasFigures(job) { return T.num(job.tp.pl.rev) !== 0 || job.comps.some(c => T.num(c.pl.rev) !== 0); }

  function applyExtraction(c, out, pages) {
    if (!out || typeof out !== 'object' || !out.pl) throw { code: 'invalid_json' };
    ['name', 'regno', 'activity', 'fye'].forEach(k => { if (out[k]) c[k] = String(out[k]).trim(); });
    T.PL_KEYS.forEach(k => c.pl[k] = T.num(out.pl[k]));
    c.pbtReported = out.pbt_reported === undefined || out.pbt_reported === null ? null : T.num(out.pbt_reported);
    T.ADJ_KEYS.forEach(k => c.adj[k] = 0); c.adjNotes = {};
    (out.adjustments || []).forEach(a => {
      if (!a || !T.ADJ_KEYS.includes(a.key)) return;
      const v = T.num(a.amount); if (!v) return;
      c.adj[a.key] = T.num(c.adj[a.key]) + v;
      c.adjNotes[a.key] = [c.adjNotes[a.key], (a.reason || '') + (a.page ? ` (page ${a.page})` : '')].filter(Boolean).join('; ');
    });
    if (out.rpt) c.rpt = { sales: T.num(out.rpt.sales), purchases: T.num(out.rpt.purchases) };
    c.keptIn = (out.kept_in || []).filter(x => x && x.item).slice(0, 12).map(x => ({ item: String(x.item), amount: T.num(x.amount), reason: String(x.reason || '') }));

      const i = c.keptIn.findIndex(x => /depreciation/i.test(x.item) && /investment propert/i.test(x.item));

        c.adj.add_ip_depreciation = Math.abs(c.keptIn[i].amount);
        c.adjNotes.add_ip_depreciation = c.keptIn[i].item + ' (rental income excluded, so its depreciation is added back)';

    onChange(e);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input.cell, .head input')) { e.preventDefault(); e.target.blur(); } });
  document.addEventListener('click', onClick);
  document.addEventListener('dragover', e => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', e => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); onFile(d.dataset.drop, e.dataTransfer.files); } });

  initAuth();
})();
</script>
</body>
</html>
